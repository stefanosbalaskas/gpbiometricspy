name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts examples
      - name: Compile
        run: python -m compileall -q src tests scripts examples
      - name: Frozen export audit
        run: python scripts/audit_r_contract.py
      - name: Tests and coverage
        run: python -m pytest -q --cov=src/gpbiometricspy --cov-report=term-missing --cov-fail-under=90
