name: cut-stable-release

on:
  workflow_run:
    workflows:
      - tests
      - docs
      - CodeQL
      - deep-parity
      - interoperability
      - private-real-data-validation
      - studio
      - studio-e2e
      - studio-production
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: cut-stable-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  cut:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering main commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve and validate stable release identity
        id: release
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version $VERSION is not a plain stable X.Y.Z release; no tag will be cut."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="$VERSION" python - <<'PY'
          import json, os, pathlib, re, tomllib
          version = os.environ['VERSION']
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          zenodo = json.loads(pathlib.Path('.zenodo.json').read_text(encoding='utf-8'))['version']
          cff = pathlib.Path('CITATION.cff').read_text(encoding='utf-8')
          match = re.search(r'(?m)^version:\s*([^\s]+)\s*$', cff)
          cff_version = match.group(1) if match else None
          values = {'project': project, 'zenodo': zenodo, 'cff': cff_version}
          if any(value != version for value in values.values()):
              raise SystemExit(f'Release identity mismatch for {version}: {values}')
          PY
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify triggering commit is still current main
        if: steps.release.outputs.eligible == 'true'
        id: current
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          TARGET_SHA="${{ github.event.workflow_run.head_sha }}"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$TARGET_SHA" != "$MAIN_SHA" ]]; then
            echo "Main moved from $TARGET_SHA to $MAIN_SHA; this validation set is stale."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=true" >> "$GITHUB_OUTPUT"
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Require every exact-main release gate
        if: steps.release.outputs.eligible == 'true' && steps.current.outputs.current == 'true'
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="${{ steps.current.outputs.sha }}"
          ready=1
          for workflow in \
            tests.yml \
            docs.yml \
            codeql.yml \
            deep-parity.yml \
            interoperability.yml \
            real-data-validation.yml \
            studio.yml \
            studio-e2e.yml \
            studio-production.yml; do
            ok="$(gh run list --workflow "$workflow" --commit "$TARGET_SHA" --branch main --limit 30 \
              --json event,conclusion \
              --jq '[.[] | select(.event == "push" and .conclusion == "success")] | length')"
            if [[ "$ok" -lt 1 ]]; then
              echo "Gate not ready yet: $workflow @ $TARGET_SHA"
              ready=0
            else
              echo "Gate green: $workflow @ $TARGET_SHA"
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Create immutable annotated release tag
        id: tag
        if: >-
          steps.release.outputs.eligible == 'true' &&
          steps.current.outputs.current == 'true' &&
          steps.gates.outputs.ready == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          TARGET_SHA="${{ steps.current.outputs.sha }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG" --force
            EXISTING_SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
            if [[ "$EXISTING_SHA" != "$TARGET_SHA" ]]; then
              echo "Existing immutable tag $TAG points to $EXISTING_SHA, not validated $TARGET_SHA" >&2
              exit 1
            fi
            echo "$TAG already exists at the validated commit; preserving it without duplicate dispatch."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "gpbiometricspy $VERSION"
          git push origin "refs/tags/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "Created $TAG at $TARGET_SHA."

      - name: Dispatch exact-tag release workflow
        if: >-
          steps.release.outputs.eligible == 'true' &&
          steps.current.outputs.current == 'true' &&
          steps.gates.outputs.ready == '1' &&
          steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          gh workflow run release.yml --ref main -f tag="$TAG"
          echo "Dispatched release.yml explicitly for $TAG; this avoids GITHUB_TOKEN tag-push recursion suppression."
