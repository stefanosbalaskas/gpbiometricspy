name: stable-freeze-edit

on:
  push:
    branches:
      - release/0.1.5-stable-freeze

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release/0.1.5-stable-freeze
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply deterministic stable-freeze edits
        run: |
          python - <<'PY'
          from pathlib import Path

          VERSION = "0.1.5"
          DEV = "0.1.5.dev0"
          ROOT = Path('.')

          text_suffixes = {'.py', '.md', '.json', '.yml', '.yaml', '.toml', '.cff'}
          scan_dirs = [ROOT / 'src', ROOT / 'tests', ROOT / 'docs', ROOT / 'scripts']
          root_files = [
              ROOT / 'README.md', ROOT / 'CHANGELOG.md', ROOT / 'VALIDATION.md',
              ROOT / 'CITATION.cff', ROOT / '.zenodo.json', ROOT / 'RELEASE_CHECKLIST.md',
              ROOT / 'ROADMAP.md', ROOT / 'RELEASE_NOTES_0.1.5.md',
          ]

          candidates = list(root_files)
          for base in scan_dirs:
              for path in base.rglob('*'):
                  if path.is_file() and path.suffix in text_suffixes:
                      candidates.append(path)

          for path in sorted(set(candidates)):
              text = path.read_text(encoding='utf-8')
              if DEV in text:
                  path.write_text(text.replace(DEV, VERSION), encoding='utf-8')

          def replace_required(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'required stable-freeze text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def replace_optional(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              if old in text:
                  p.write_text(text.replace(old, new), encoding='utf-8')

          # README: make the current stable identity and evidence unambiguous.
          replace_required(
              'README.md',
              '| Stable release | **0.1.4** |\n| Development head | **0.1.5** |\n| Release date | **2026-09-06** |',
              '| Stable release | **0.1.5** |\n| Release date | **2026-09-08** |',
          )
          replace_required('README.md', '| Development validation |', '| Release validation |')
          replace_required(
              'README.md',
              'Stable `0.1.4` remains immutable at its release evidence (**557 tests · 10,316/10,316 statements · 5,575/5,594 raw branches = 99.6604%**). The larger figures above describe the live `0.1.5` development line and do not rewrite historical release evidence.',
              'Stable `0.1.4` remains immutable at its historical release evidence (**557 tests · 10,316/10,316 statements · 5,575/5,594 raw branches = 99.6604%**). Stable `0.1.5` freezes the larger current evidence (**567 tests · 10,456/10,456 statements · 5,629/5,648 raw branches = 99.6636%**) without rewriting the 0.1.4 record.',
          )
          replace_optional('README.md', '**Current development validation:**', '**Stable 0.1.5 validation:**')
          replace_optional('README.md', '**Measurement accountability:** development `0.1.5` adds', '**Measurement accountability:** stable `0.1.5` adds')
          replace_optional('README.md', 'In stable `0.1.4`, it is included', 'In stable `0.1.5`, it is included')
          replace_optional('README.md', 'Development on `main` goes beyond the 406/406 export freeze.', 'Stable `0.1.5` goes beyond the original 406/406 export freeze.')
          replace_optional('README.md', 'The current scientific development validation baseline is:', 'The stable 0.1.5 validation baseline is:')
          replace_optional('README.md', 'Development `0.1.5` extends that evidence', 'Stable `0.1.5` extends that evidence')
          replace_required(
              'README.md',
              '`gpbiometricspy 0.1.4` is the current stable release. Its version-specific Zenodo DOI is **10.5281/zenodo.22515782**; live repository development proceeds as `0.1.5`, while the concept DOI identifies the evolving Python software record.',
              '`gpbiometricspy 0.1.5` is the current stable release source. Its version-specific Zenodo DOI will be recorded only after Zenodo ingests the immutable `v0.1.5` GitHub release; the concept DOI identifies the evolving Python software record.',
          )
          replace_required(
              'README.md',
              '- **Version DOI (0.1.4):** [10.5281/zenodo.22515782](https://doi.org/10.5281/zenodo.22515782)\n- **Software concept DOI:**',
              '- **Version DOI (0.1.5):** pending Zenodo ingestion — not yet minted\n- **Previous version DOI (0.1.4):** [10.5281/zenodo.22515782](https://doi.org/10.5281/zenodo.22515782)\n- **Software concept DOI:**',
          )
          replace_optional('README.md', '- **Previous version DOI (0.1.3):**', '- **Earlier version DOI (0.1.3):**')

          # Docs landing page: replace the mixed stable/development block with stable 0.1.5 evidence.
          index = ROOT / 'docs/index.md'
          text = index.read_text(encoding='utf-8')
          start = text.index('<div class="gp-status-grid">')
          end = text.index('## Code or Studio')
          block = '''<div class="gp-status-grid">
          <div><span class="gp-status-value">0.1.5</span><span class="gp-status-label">stable release</span></div>
          <div><span class="gp-status-value">2026-09-08</span><span class="gp-status-label">release date</span></div>
          <div><span class="gp-status-value">406 / 406</span><span class="gp-status-label">R exports implemented</span></div>
          <div><span class="gp-status-value">100%</span><span class="gp-status-label">statement coverage</span></div>
          <div><span class="gp-status-value">99.6636%</span><span class="gp-status-label">raw branch coverage</span></div>
          <div><span class="gp-status-value">0</span><span class="gp-status-label">unaudited branch debt</span></div>
          <div><span class="gp-status-value">3.11–3.14</span><span class="gp-status-label">Python CI matrix</span></div>
          </div>

          !!! success "Stable 0.1.5 release source"
              Stable `gpbiometricspy 0.1.5` (2026-09-08) preserves **406/406 exports with 0 pending** and freezes the current validation baseline at **567 passing tests**, **10,456/10,456 statements = 100.00%**, and **5,629/5,648 raw branches = 99.6636%**. The same **19 reviewed structural arcs** remain, with **0 unexpected**, **0 stale**, and **0 unaudited** branch debt. Audited branch accounting is **5,648/5,648 = 100.0000%** without relabelling the honest raw metric. The 0.1.5 Zenodo version DOI is intentionally absent until ingestion; the previous 0.1.4 DOI remains [10.5281/zenodo.22515782](https://doi.org/10.5281/zenodo.22515782), and the software concept DOI remains [10.5281/zenodo.22150872](https://doi.org/10.5281/zenodo.22150872).

          !!! note "0.1.5 measurement-accountability additions"
              Version `0.1.5` adds metric-specific ECG-HRV/PPG-PRV agreement through `compare_hrv_prv_devices()`, retention-first SCR responsivity through `scr_responsivity_sensitivity()`, a five-stage `validation_ladder()`, and experimental topology-aware PPG morphology through `ppg_topology_features()`. Agreement is assessed **per derived metric and acquisition configuration**, low-reactive SCR participants are retained for sensitivity analysis rather than automatically deleted, generalization requires held-out-person evidence, and topology outputs remain structural descriptors rather than direct physiological surrogates. See [Measurement accountability](measurement-accountability.md).

          !!! note "Installed Studio replay evidence"
              Stable `0.1.5` expands production browser validation into installed **wheel and sdist** replay paths on Python 3.11 and 3.14. High-value physiology, gaze/pupil, external event/alignment, multimodal/modelling, and cluster-permutation paths are exercised with deterministic replay completion checks and fail-closed dataset/secondary-resource fingerprint validation. The public synthetic deployment boundary remains upload-restricted and separate from full local/authenticated research-data use.

          '''
          index.write_text(text[:start] + block + text[end:], encoding='utf-8')
          replace_optional('docs/index.md', 'Current development CI enforces', 'Stable 0.1.5 CI enforces')

          # Citation page: pre-ingestion stable identity without inventing a DOI.
          (ROOT / 'docs/citation.md').write_text('''# Citation and archival

          `gpbiometricspy` is archived through the Zenodo GitHub integration.

          <div class="gp-version-note">
          <strong>Current citation state:</strong> stable Python release <code>0.1.5</code> (2026-09-08). Its version-specific Zenodo DOI will be added only after Zenodo ingests the immutable <code>v0.1.5</code> GitHub release; the software concept DOI remains the identifier for the evolving record.
          </div>

          ## Cite the Python software

          For reproducibility, cite the exact software release used. During the pre-ingestion window for 0.1.5, use the release/tag metadata and update the citation with the minted 0.1.5 version DOI once Zenodo publishes it.

          - **0.1.5 version DOI:** pending Zenodo ingestion — not invented in release metadata
          - **Previous 0.1.4 version DOI:** **[10.5281/zenodo.22515782](https://doi.org/10.5281/zenodo.22515782)**
          - **Earlier 0.1.3 version DOI:** **[10.5281/zenodo.22313884](https://doi.org/10.5281/zenodo.22313884)**
          - **Earlier 0.1.2 version DOI:** **[10.5281/zenodo.22150873](https://doi.org/10.5281/zenodo.22150873)**
          - **Software concept DOI:** **[10.5281/zenodo.22150872](https://doi.org/10.5281/zenodo.22150872)**

          Zenodo recommends the version DOI when citing a specific research artifact version. The concept DOI identifies the evolving software family.

          GitHub reads [`CITATION.cff`](https://github.com/stefanosbalaskas/gpbiometricspy/blob/main/CITATION.cff) for its **Cite this repository** control. The 0.1.5 stable freeze records the version and release date but intentionally omits a version DOI until Zenodo mints one.

          ## Published gpbiometrics paper

          The peer-reviewed paper describing the original R package is:

          > Balaskas, S. **gpbiometrics: An R Package for Reproducible Analysis and Reporting of Gazepoint Biometrics Exports.** *Signals* **2026**, *7*, 86. [https://doi.org/10.3390/signals7050086](https://doi.org/10.3390/signals7050086)

          This article documents the R `gpbiometrics` package that provides the scientific and software lineage for `gpbiometricspy`. When an analysis uses the Python package, cite the relevant `gpbiometricspy` software version as well; the R-package article is a related publication rather than a substitute for the Python software citation.

          ## R reference provenance

          The frozen semantic reference is **gpbiometrics 2.0.0**, independently archived at DOI **[10.5281/zenodo.21434608](https://doi.org/10.5281/zenodo.21434608)**.

          That DOI identifies the R reference package. `.zenodo.json` preserves it with relation `isDerivedFrom`, so the Python and R software objects remain distinct.

          ## Metadata files

          - `CITATION.cff` identifies stable Python release 0.1.5 and release date 2026-09-08; its DOI is intentionally absent before Zenodo ingestion.
          - `.zenodo.json` identifies archival software version 0.1.5 and preserves the R-reference provenance relationship.
          - README and documentation use the Python concept DOI for the evolving software family while retaining earlier version DOIs for reproducible citation.

          ## Interpretation

          A Zenodo DOI provides a persistent identifier for a software archive. It does not replace the package's scientific validation evidence, which remains documented under [Parity & validation](parity.md) and [Deep validation](deep-validation.md).
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          # Release-sensitive tests must match stable pre-Zenodo semantics.
          replace_required('tests/test_post_release_completeness.py', 'assert "version: 0.1.4" in cff', 'assert "version: 0.1.5" in cff')
          replace_required('tests/test_post_release_completeness.py', 'assert "date-released: 2026-09-06" in cff', 'assert "date-released: 2026-09-08" in cff')
          replace_required('tests/test_post_release_completeness.py', 'assert "doi: 10.5281/zenodo.22515782" in cff', 'assert "doi: 10.5281/zenodo.22515782" not in cff')

          # Other public release-facing docs.
          replace_required('docs/getting-started.md', '`0.1.4` is the stable public release', '`0.1.5` is the stable public release')
          replace_required('docs/studio.md', 'stable `0.1.4` distribution', 'stable `0.1.5` distribution')
          replace_required('docs/plot-gallery.md', '<strong>Stable 0.1.4 documentation.</strong> This gallery is frozen from the validated <code>0.1.4</code> release source.', '<strong>Stable 0.1.5 documentation.</strong> This gallery is frozen from the validated <code>0.1.5</code> release source.')
          replace_required('docs/release-0.1.4.md', 'The immutable `v0.1.4` release is unchanged by post-release development. Live `main` advances separately as `0.1.5` while `CITATION.cff` remains pinned to the stable 0.1.4 archival record.', 'The immutable `v0.1.4` release remains unchanged. Stable `0.1.5` now supersedes it as the current release source, while DOI `10.5281/zenodo.22515782` remains the immutable version-specific identifier for 0.1.4.')

          # Roadmap: freeze the completed development tranche and list only downstream publication tasks.
          roadmap = ROOT / 'ROADMAP.md'
          text = roadmap.read_text(encoding='utf-8')
          marker = '## Active: 0.1.5 measurement accountability, replay reliability, and release readiness'
          if marker not in text:
              raise SystemExit('0.1.5 roadmap marker not found')
          prefix = text.split(marker, 1)[0]
          roadmap_tail = '''## Stable freeze: 0.1.5 measurement accountability, replay reliability, and release readiness

          Version 0.1.5 freezes the completed validation/reliability line while preserving the **406/406, 0 pending** `gpbiometrics 2.0.0` scientific contract.

          ### Frozen in 0.1.5

          - metric-specific ECG-HRV/PPG-PRV agreement, SCR responsivity sensitivity, a five-stage validation ladder, and experimental topology-aware PPG structural descriptors with conservative interpretation boundaries;
          - **567 tests** and **10,456 / 10,456 = 100.00% statement coverage**;
          - **5,629 / 5,648 = 99.6636% raw branch coverage**, a **99.6000%** raw floor, exactly **19** reviewed structural arcs, and **0 unexpected / 0 stale / 0 unaudited** debt;
          - fail-closed branch-auditor pipeline behavior through Bash `pipefail`;
          - installed Studio wheel/sdist Chromium validation on Python 3.11 and 3.14 across local/public CLI entrypoints, physiology, external event alignment, multimodal/model preparation, and cluster-permutation replay;
          - deterministic replay identity checks for primary data, event logs, and target streams, including wrong/missing-resource rejection without serializing raw secondary paths;
          - production-compatible upload synchronization and preservation of the synthetic-only public deployment boundary;
          - independent R↔Python golden parity, optional-backend interoperability, private real-data validation, CodeQL, docs, and Studio release gates.

          ### Remaining release completion

          1. qualify the exact stable-freeze PR head and merge only that pinned SHA;
          2. require all ten exact-main stable-release gate families to succeed on the merged stable commit;
          3. allow the protected tag cutter to create immutable `v0.1.5` only from that exact qualified commit;
          4. verify GitHub Release assets, SHA-256 manifest, protected PyPI Trusted Publishing, and clean public-index installation;
          5. wait for Zenodo ingestion before recording any 0.1.5 version DOI;
          6. retain concept DOI `10.5281/zenodo.22150872`, previous 0.1.4 DOI `10.5281/zenodo.22515782`, and R-reference `isDerivedFrom` provenance;
          7. return `main` to a new development version only after public-release and archival closeout.
          '''.replace('\n          ', '\n')
          roadmap.write_text(prefix + roadmap_tail, encoding='utf-8')

          # Release checklist: readiness tranche is closed; freeze/publication gates remain explicit.
          checklist = ROOT / 'RELEASE_CHECKLIST.md'
          text = checklist.read_text(encoding='utf-8')
          marker = '\n## 0.1.5 — reliability, measurement accountability, and release readiness'
          if marker not in text:
              raise SystemExit('0.1.5 checklist marker not found')
          prefix = text.split(marker, 1)[0]
          checklist_tail = '''
          ## 0.1.5 — reliability, measurement accountability, and stable-release freeze

          - [x] Preserve the frozen `gpbiometrics 2.0.0` semantic contract at **406/406 implemented exports, 0 pending**.
          - [x] Add measurement-accountability methods for derived-metric HRV/PRV agreement, SCR responsivity sensitivity, validation-ladder evidence, and experimental topology-aware PPG morphology without changing the frozen export contract.
          - [x] Validate installed scientific replay across physiology, gaze/pupil, events/alignment, multimodal/modelling, and cluster-permutation paths on Python 3.11 and 3.14 wheel/sdist production boundaries.
          - [x] Make branch-coverage enforcement fail closed through `tee` and cover the newly reachable non-finite topology branch rather than exempting it.
          - [x] Freeze validation evidence at **567 tests**, **10,456/10,456 statements = 100.00%**, **5,629/5,648 raw branches = 99.6636%**, exactly **19** reviewed structural arcs, and **0 unexpected / 0 stale / 0 unaudited** branch debt.
          - [x] Merge and exact-main qualify the separate 0.1.5 release-readiness documentation tranche before beginning the stable freeze.
          - [x] Promote package/runtime/Zenodo/generated documentation identity to stable `0.1.5`, set `CITATION.cff` to **0.1.5 / 2026-09-08**, and deliberately omit a 0.1.5 version DOI before Zenodo ingestion.
          - [x] Retain software concept DOI `10.5281/zenodo.22150872`, previous 0.1.4 DOI `10.5281/zenodo.22515782`, and R-reference DOI `10.5281/zenodo.21434608` only in their correct roles.
          - [ ] Require every workflow family triggered by the exact stable-freeze PR head to pass before pinned-head squash merge.
          - [ ] Require all ten stable-release gate families to succeed on the exact merged stable `main` commit before creating `v0.1.5`.
          - [ ] Create immutable annotated `v0.1.5`, let the protected release workflow build/check GitHub assets, and verify the SHA-256 manifest.
          - [ ] Confirm protected PyPI Trusted Publishing publishes `gpbiometricspy==0.1.5` and fresh public-index installs succeed.
          - [ ] Wait for Zenodo to ingest the immutable GitHub release; record the actual 0.1.5 version DOI only after it exists.
          '''.replace('\n          ', '\n')
          checklist.write_text(prefix + checklist_tail, encoding='utf-8')

          # Dedicated site page and navigation for the release freeze.
          (ROOT / 'docs/release-0.1.5.md').write_text('''# gpbiometricspy 0.1.5

          Release source frozen **2026-09-08**.

          See the repository [0.1.5 release notes](https://github.com/stefanosbalaskas/gpbiometricspy/blob/main/RELEASE_NOTES_0.1.5.md) for the complete stable-release summary.

          The release preserves the frozen **406-export** scientific contract while freezing **567 tests**, **10,456/10,456 = 100% statement coverage**, **5,629/5,648 = 99.6636% raw branch coverage**, and the exact **19-arc** structural-debt contract with **0 unexpected, 0 stale, and 0 unaudited branch debt**.

          Version 0.1.5 adds measurement-accountability methods and materially expands installed Studio wheel/sdist replay validation without changing the frozen R export surface.

          The 0.1.5 Zenodo version DOI is intentionally left pending until Zenodo ingests the immutable GitHub release. The previous 0.1.4 version DOI remains **10.5281/zenodo.22515782**, the software concept DOI remains **10.5281/zenodo.22150872**, and the frozen R reference remains **10.5281/zenodo.21434608** as provenance.
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')
          mkdocs = ROOT / 'mkdocs.yml'
          text = mkdocs.read_text(encoding='utf-8')
          nav_old = '  - Citation & archival: citation.md\n  - Development: development.md\n'
          nav_new = '  - Citation & archival: citation.md\n  - Release 0.1.5: release-0.1.5.md\n  - Development: development.md\n'
          if nav_old not in text:
              raise SystemExit('mkdocs release navigation anchor not found')
          mkdocs.write_text(text.replace(nav_old, nav_new), encoding='utf-8')

          # Append an explicit stable-freeze validation record if not already present.
          validation = ROOT / 'VALIDATION.md'
          text = validation.read_text(encoding='utf-8')
          heading = '## 0.1.5 stable release freeze — 2026-09-08'
          if heading not in text:
              text += f'''\n\n{heading}\n\nThe 0.1.5 release source freezes the completed reliability and measurement-accountability line without changing the frozen 406-function R contract.\n\n- package/runtime identity: **0.1.5**;\n- frozen R semantic reference: **gpbiometrics 2.0.0**;\n- API contract: **406 / 406 implemented; 0 pending**;\n- scientific regression suite: **567 tests**;\n- statements: **10,456 / 10,456 = 100.000%**;\n- raw branches: **5,629 / 5,648 = 99.6636%** with a **99.6% raw branch CI floor**;\n- audited structural residual arcs: **19**, with **0 unexpected, 0 stale, 0 unaudited branch debt**;\n- audited branch accounting: **5,648 / 5,648 = 100.0000%**, explicitly not substituted for the raw metric;\n- installed Studio wheel/sdist replay qualification covers high-value scientific paths on Python 3.11 and 3.14;\n- stable tagging remains blocked until every exact-main release gate succeeds;\n- no 0.1.5 Zenodo version DOI is recorded before Zenodo actually ingests the immutable release.\n'''
              validation.write_text(text, encoding='utf-8')

          # Final strict identity scan over the release auditor's surfaces plus release-facing root files.
          offenders = []
          for path in sorted(set(candidates + [ROOT / 'docs/release-0.1.5.md'])):
              if path.exists() and DEV in path.read_text(encoding='utf-8'):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit('development literals remain after freeze: ' + ', '.join(offenders))
          PY

      - name: Audit stable release identity
        run: python scripts/audit_release_identity.py

      - name: Validate diff whitespace
        run: git diff --check

      - name: Commit freeze and remove temporary workflow
        run: |
          rm .github/workflows/_stable-freeze-edit.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: complete 0.1.5 stable freeze"
          git push origin HEAD:release/0.1.5-stable-freeze
