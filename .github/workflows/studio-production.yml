name: studio-production

on:
  pull_request:
    paths:
      - "app.py"
      - "requirements.txt"
      - "studio/**"
      - "pyproject.toml"
      - ".github/workflows/studio-production.yml"
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "requirements.txt"
      - "studio/**"
      - "pyproject.toml"
      - ".github/workflows/studio-production.yml"

permissions:
  contents: read

jobs:
  production-smoke:
    name: production-smoke (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      SHINY_OTEL_COLLECT: none
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deployment requirements
        run: python -m pip install -r requirements.txt
      - name: Install test tools
        run: python -m pip install pytest ruff
      - name: Ruff production boundary
        run: ruff check app.py studio/config.py studio/public_demo.py studio/production.py studio/tests/test_production_hardening.py
      - name: Compile production boundary
        run: python -m compileall -q app.py studio/config.py studio/public_demo.py studio/production.py
      - name: Production policy tests
        run: python -m pytest -q studio/tests/test_production_hardening.py
      - name: Synthetic runtime smoke profile
        run: python -m studio.production --json studio-production-metrics.json
      - name: Upload runtime metrics
        uses: actions/upload-artifact@v6
        with:
          name: studio-production-metrics-py${{ matrix.python-version }}
          path: studio-production-metrics.json
          if-no-files-found: error
