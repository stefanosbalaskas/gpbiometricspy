name: studio-production

on:
  pull_request:
    paths:
      - "app.py"
      - "requirements.txt"
      - "studio/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/studio-production.yml"
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "requirements.txt"
      - "studio/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/studio-production.yml"

permissions:
  contents: read

jobs:
  production-smoke:
    name: production-smoke (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      SHINY_OTEL_COLLECT: none
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deployment requirements
        run: python -m pip install -r requirements.txt
      - name: Install test/build tools
        run: python -m pip install pytest ruff build pytest-playwright
      - name: Ruff production boundary
        run: ruff check app.py studio/config.py studio/cli.py studio/public_demo.py studio/production.py studio/tests/test_cli.py studio/tests/test_production_hardening.py studio/e2e/test_installed_public_cli_e2e.py studio/e2e/test_installed_local_cli_e2e.py studio/e2e/test_installed_external_event_replay_e2e.py
      - name: Compile production boundary
        run: python -m compileall -q app.py studio/config.py studio/cli.py studio/public_demo.py studio/production.py studio/e2e/test_installed_public_cli_e2e.py studio/e2e/test_installed_local_cli_e2e.py studio/e2e/test_installed_external_event_replay_e2e.py
      - name: Verify installed distribution carries Studio
        run: |
          python - <<'PY'
          from importlib.metadata import distribution

          dist = distribution("gpbiometricspy")
          paths = {str(item) for item in (dist.files or [])}
          required = {
              "studio/__init__.py",
              "studio/app.py",
              "studio/cli.py",
              "studio/public_demo.py",
              "studio/modules/__init__.py",
              "studio/www/studio.css",
              "studio/www/public-demo.css",
          }
          missing = sorted(required - paths)
          assert not missing, f"Studio files missing from installed distribution: {missing}"
          scripts = {ep.name: ep.value for ep in dist.entry_points if ep.group == "console_scripts"}
          assert scripts.get("gpbiometricspy-studio") == "studio.cli:main"
          assert scripts.get("gpbiometricspy-studio-public") == "studio.cli:main_public"
          PY
      - name: Production policy and CLI tests
        run: python -m pytest -q studio/tests/test_production_hardening.py studio/tests/test_cli.py
      - name: Verify source distribution carries deployment assets
        run: |
          python -m build --sdist
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive = next(Path("dist").glob("gpbiometricspy-*.tar.gz"))
          with tarfile.open(archive, "r:gz") as tar:
              names = set(tar.getnames())
          root = next(name.split("/", 1)[0] for name in names if "/studio/app.py" in name)
          required = {
              f"{root}/app.py",
              f"{root}/requirements.txt",
              f"{root}/DEPLOYMENT.md",
              f"{root}/studio/app.py",
              f"{root}/studio/public_demo.py",
              f"{root}/studio/www/studio.css",
          }
          missing = sorted(required - names)
          assert not missing, f"Deployment assets missing from sdist: {missing}"
          PY
      - name: Build wheel for installed-artifact browser smoke
        run: python -m build --wheel
      - name: Install Chromium for installed-artifact browser smoke
        run: python -m playwright install --with-deps chromium
      - name: Launch installed wheel and sdist Studio entrypoints in Chromium
        shell: bash
        run: |
          set -euo pipefail

          wheel="$(readlink -f "$(find dist -maxdepth 1 -name 'gpbiometricspy-*.whl' -print -quit)")"
          sdist="$(readlink -f "$(find dist -maxdepth 1 -name 'gpbiometricspy-*.tar.gz' -print -quit)")"
          test -n "$wheel"
          test -n "$sdist"

          exercise_artifact() (
            set -euo pipefail
            kind="$1"
            artifact="$2"
            public_port="$3"
            local_port="$4"
            envdir="$(mktemp -d)"
            venv="$envdir/venv"
            server_pid=""
            server_log=""

            stop_server() {
              if [[ -n "$server_pid" ]]; then
                pkill -TERM -P "$server_pid" 2>/dev/null || true
                kill "$server_pid" 2>/dev/null || true
                wait "$server_pid" 2>/dev/null || true
                server_pid=""
              fi
            }

            cleanup() {
              status=$?
              trap - EXIT
              stop_server
              if [[ $status -ne 0 && -n "$server_log" && -f "$server_log" ]]; then
                echo "---- installed ${kind} Studio log ----"
                cat "$server_log"
              fi
              rm -rf "$envdir"
              exit "$status"
            }
            trap cleanup EXIT

            python -m venv "$venv"
            "$venv/bin/python" -m pip install --upgrade pip
            "$venv/bin/python" -m pip install "${artifact}[studio]"

            installed_studio="$(
              cd "$envdir"
              "$venv/bin/python" - <<'PY'
          from pathlib import Path
          import studio
          print(Path(studio.__file__).resolve())
          PY
            )"
            case "$installed_studio" in
              "$venv"/*) ;;
              *) echo "Studio resolved outside isolated ${kind} environment: $installed_studio" >&2; exit 1 ;;
            esac

            run_studio_mode() {
              mode="$1"
              launcher="$2"
              port="$3"
              server_log="$envdir/${mode}-studio-${kind}.log"

              (
                cd "$envdir"
                exec "$venv/bin/$launcher" --host 127.0.0.1 --port "$port" >"$server_log" 2>&1
              ) &
              server_pid=$!

              ready=0
              for _ in $(seq 1 60); do
                if curl --fail --silent --show-error "http://127.0.0.1:${port}/" >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  echo "Installed ${kind} ${mode} Studio exited before becoming ready." >&2
                  return 1
                fi
                sleep 1
              done
              test "$ready" -eq 1 || { echo "Installed ${kind} ${mode} Studio did not become ready." >&2; return 1; }

              if [[ "$mode" == "public" ]]; then
                GPBIOMETRICSPY_INSTALLED_ARTIFACT_KIND="$kind" \
                  GPBIOMETRICSPY_INSTALLED_PUBLIC_URL="http://127.0.0.1:${port}/" \
                  python -m pytest -q studio/e2e/test_installed_public_cli_e2e.py --browser chromium
              else
                GPBIOMETRICSPY_INSTALLED_ARTIFACT_KIND="$kind" \
                  GPBIOMETRICSPY_INSTALLED_LOCAL_URL="http://127.0.0.1:${port}/" \
                  GPBIOMETRICSPY_INSTALLED_PYTHON="$venv/bin/python" \
                  python -m pytest -q studio/e2e/test_installed_local_cli_e2e.py studio/e2e/test_installed_external_event_replay_e2e.py --browser chromium
              fi

              stop_server
            }

            run_studio_mode public gpbiometricspy-studio-public "$public_port"
            run_studio_mode local gpbiometricspy-studio "$local_port"
          )

          exercise_artifact wheel "$wheel" 8765 8767
          exercise_artifact sdist "$sdist" 8766 8768
      - name: Synthetic runtime smoke profile
        run: python -m studio.production --json studio-production-metrics.json
      - name: Upload runtime metrics
        uses: actions/upload-artifact@v6
        with:
          name: studio-production-metrics-py${{ matrix.python-version }}
          path: studio-production-metrics.json
          if-no-files-found: error
