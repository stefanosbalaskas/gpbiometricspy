name: docs
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CITATION.cff"
      - ".zenodo.json"
      - "pyproject.toml"
      - "scripts/generate_reference_docs.py"
      - "scripts/generate_docs_gallery.py"
      - ".github/workflows/docs.yml"
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[docs]"
      - run: PYTHONPATH=src python scripts/generate_reference_docs.py
      - name: Validate generated API, curated articles, and Studio guide
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path("docs/api")
          domains = [
              "eda-scr",
              "ppg-hrv",
              "pupil-gaze-aoi",
              "alignment-multimodal",
              "qc-reporting",
              "statistics-design",
              "interoperability",
              "core-io",
          ]
          required_api = [api / "index.md", api / "reference.md"] + [
              api / f"{slug}.md" for slug in domains
          ]
          for page in required_api:
              assert page.exists(), page

          reference = (api / "reference.md").read_text(encoding="utf-8")
          assert reference.count("\n## `") == 406
          index = (api / "index.md").read_text(encoding="utf-8")
          assert "data-api-filter" in index
          assert "406 functions" in index

          domain_total = 0
          for slug in domains:
              text = (api / f"{slug}.md").read_text(encoding="utf-8")
              assert "## Functions" in text, slug
              line = next(
                  line for line in text.splitlines()
                  if line.startswith("**") and " functions**" in line
              )
              domain_total += int(line.split("**", 2)[1].split()[0])
          assert domain_total == 406, domain_total

          articles = sorted(Path("docs/articles").glob("*.md"))
          companions = [p for p in articles if p.name != "index.md"]
          assert len(companions) == 26, len(companions)
          assert all(
              "## Executable Python companion" in p.read_text(encoding="utf-8")
              for p in companions
          )
          article_index = Path("docs/articles/index.md").read_text(encoding="utf-8")
          assert "# Articles and tutorials" in article_index
          assert "All **26** frozen R vignette/article sources" in article_index

          studio = Path("docs/studio.md").read_text(encoding="utf-8")
          assert "# gpbiometricspy Studio" in studio
          assert "gpbiometricspy-studio" in studio
          assert "synthetic-only" in studio
          assert "Chromium E2E" in studio
          PY
      - name: Validate citation and Zenodo metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z = json.loads(Path('.zenodo.json').read_text(encoding='utf-8'))
          assert z['version'] == '0.1.3.dev0'
          assert z['upload_type'] == 'software'
          assert z['access_right'] == 'open'
          assert z['license'] == 'mit'
          assert z['creators'][0]['orcid'] == '0000-0003-2444-9796'
          assert any(
              item['identifier'] == 'https://doi.org/10.5281/zenodo.21434608'
              and item['relation'] == 'isDerivedFrom'
              for item in z['related_identifiers']
          )
          cff = Path('CITATION.cff').read_text(encoding='utf-8')
          assert 'https://orcid.org/0000-0003-2444-9796' in cff
          assert 'version: 0.1.2' in cff
          assert 'doi: 10.5281/zenodo.22150873' in cff
          PY
      - run: PYTHONPATH=src python scripts/generate_docs_gallery.py
      - run: python -c "import json, pathlib; p=pathlib.Path('docs/assets/generated/manifest.json'); d=json.loads(p.read_text()); assert len(d['figures']) == 13"
      - run: mkdocs build --strict
      - name: Deploy GitHub Pages from main only
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: mkdocs gh-deploy --force
