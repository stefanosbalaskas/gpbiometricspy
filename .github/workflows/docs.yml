name: docs
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[docs]"
      - run: PYTHONPATH=src python scripts/generate_reference_docs.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          articles = sorted(Path("docs/articles").glob("*.md"))
          companions = [p for p in articles if p.name != "index.md"]
          assert len(companions) == 26, len(companions)
          assert all("## Executable Python companion" in p.read_text(encoding="utf-8") for p in companions)
          index = Path("docs/articles/index.md").read_text(encoding="utf-8")
          assert "# Articles and tutorials" in index
          assert "All **26** frozen R vignette/article sources" in index
          PY
      - name: Validate citation and Zenodo metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z = json.loads(Path('.zenodo.json').read_text(encoding='utf-8'))
          assert z['version'] == '0.1.2'
          assert z['upload_type'] == 'software'
          assert z['access_right'] == 'open'
          assert z['license'] == 'mit'
          assert z['creators'][0]['orcid'] == '0000-0003-2444-9796'
          assert any(
              item['identifier'] == 'https://doi.org/10.5281/zenodo.21434608'
              and item['relation'] == 'isDerivedFrom'
              for item in z['related_identifiers']
          )
          cff = Path('CITATION.cff').read_text(encoding='utf-8')
          assert 'https://orcid.org/0000-0003-2444-9796' in cff
          assert 'version: 0.1.2' in cff
          PY
      - run: PYTHONPATH=src python scripts/generate_docs_gallery.py
      - run: python -c "import json, pathlib; p=pathlib.Path('docs/assets/generated/manifest.json'); d=json.loads(p.read_text()); assert len(d['figures']) == 13"
      - run: mkdocs build --strict
      - run: mkdocs gh-deploy --force
