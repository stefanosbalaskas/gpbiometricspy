name: prepare-0.1.6-release-freeze

on:
  push:
    branches: ["release/0.1.6"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7.0.1
        with:
          ref: release/0.1.6
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply deterministic stable identity freeze
        run: python tools/release/prepare_0_1_6.py

      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate stable identity and focused release contracts
        run: |
          python -m compileall -q src tests scripts
          python scripts/audit_r_contract.py
          python scripts/audit_release_identity.py
          python -m pytest -q \
            tests/test_post_release_completeness.py \
            tests/test_coverage_completion_remaining_core.py \
            tests/test_production_release_handoff_wiring.py \
            tests/test_stable_release_artifact_contract.py

      - name: Commit final release candidate and remove preparation machinery
        run: |
          set -euo pipefail
          rm tools/release/prepare_0_1_6.py
          rm .github/workflows/prepare-0.1.6.yml
          git add -A
          git diff --cached --quiet && { echo "No release-freeze changes produced" >&2; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: freeze gpbiometricspy 0.1.6 identity"
          git push origin HEAD:release/0.1.6
