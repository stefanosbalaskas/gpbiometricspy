name: studio-project-identity-helper

on:
  push:
    branches:
      - studio/product-polish-0.1.6
    paths:
      - .github/workflows/studio-project-identity-helper.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/product-polish-0.1.6
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wire project identity through app and recipes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}\nTARGET:\n{old}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "studio/reporting_services.py",
              '        "python_version": platform.python_version(),\n        "source_name": state.source_name,',
              '        "python_version": platform.python_version(),\n        "project": {"name": state.project_name},\n        "source_name": state.source_name,',
          )
          replace_once(
              "studio/reporting_services.py",
              '    return state.with_restored_session_metadata(\n        annotations=recipe.get("annotations") or (),\n        provenance=recipe.get("provenance") or (),\n        recipe_fingerprint=str(recipe["dataset"]["sha256"]),\n    )',
              '    project = recipe.get("project") or {}\n    project_name = project.get("name") if isinstance(project, dict) else None\n    return state.with_restored_session_metadata(\n        annotations=recipe.get("annotations") or (),\n        provenance=recipe.get("provenance") or (),\n        recipe_fingerprint=str(recipe["dataset"]["sha256"]),\n        project_name=project_name,\n    )',
          )
          replace_once(
              "studio/reporting_services.py",
              '            "studio": "gpbiometricspy Studio",\n            "dataset_sha256": fingerprint,',
              '            "studio": "gpbiometricspy Studio",\n            "project_name": state.project_name,\n            "dataset_sha256": fingerprint,',
          )
          replace_once(
              "studio/reporting_services.py",
              '    return {\n        "title": clean_title,\n        "subtitle": clean_subtitle,',
              '    return {\n        "title": clean_title,\n        "subtitle": clean_subtitle,\n        "project_name": state.project_name,',
          )
          replace_once(
              "studio/reporting_services.py",
              '        f"- gpbiometricspy version: `{gp.__version__}`",\n        f"- dataset SHA-256: `{artifacts[\'dataset_fingerprint\']}`",',
              '        f"- project: `{artifacts.get(\'project_name\', \'Untitled project\')}`",\n        f"- gpbiometricspy version: `{gp.__version__}`",\n        f"- dataset SHA-256: `{artifacts[\'dataset_fingerprint\']}`",',
          )
          replace_once(
              "studio/reporting_services.py",
              '        "studio": {\n            "dataset_sha256": artifacts["dataset_fingerprint"],',
              '        "studio": {\n            "project_name": artifacts.get("project_name", "Untitled project"),\n            "dataset_sha256": artifacts["dataset_fingerprint"],',
          )

          replace_once(
              "studio/app.py",
              '        ui.input_action_button("load_demo", "Load synthetic demo", class_="btn-primary w-100"),',
              '        ui.input_text("project_name_input", "Project name", value="Untitled project"),\n        ui.input_action_button("apply_project_name", "Apply project name", class_="btn-outline-secondary w-100 mb-2"),\n        ui.input_action_button("load_demo", "Load synthetic demo", class_="btn-primary w-100"),',
          )
          replace_once(
              "studio/app.py",
              '    @reactive.effect\n    @reactive.event(input.load_demo)\n    def _load_demo():',
              '    @reactive.effect\n    @reactive.event(input.apply_project_name)\n    def _apply_project_name():\n        try:\n            state.set(state().with_project_name(input.project_name_input()))\n            status_text.set(f"Project name set to {state().project_name!r}.")\n        except Exception as exc:\n            status_text.set(_safe_error("Project name not updated", exc))\n\n    @reactive.effect\n    @reactive.event(input.load_demo)\n    def _load_demo():',
          )
          replace_once(
              "studio/app.py",
              '        return f"{qc_label} · {len(current.analyses)} analyses · {len(current.annotations)} annotations"',
              '        return f"{current.project_name} · {qc_label} · {len(current.analyses)} analyses · {len(current.annotations)} annotations"',
          )

          replace_once(
              "studio/tests/test_reporting_reproducibility.py",
              '    assert recipe["schema"] == PROJECT_RECIPE_SCHEMA\n    assert recipe["dataset"]["sha256"] == dataset_fingerprint(state.data)',
              '    assert recipe["schema"] == PROJECT_RECIPE_SCHEMA\n    assert recipe["project"]["name"] == state.project_name\n    assert recipe["dataset"]["sha256"] == dataset_fingerprint(state.data)',
          )
          replace_once(
              "studio/tests/test_reporting_reproducibility.py",
              '    original = _state()\n    recipe = project_recipe(original)',
              '    original = _state().with_project_name("Synthetic reporting study")\n    recipe = project_recipe(original)',
          )
          replace_once(
              "studio/tests/test_reporting_reproducibility.py",
              '    assert len(restored.annotations) == 1\n    assert restored.analyses == {}',
              '    assert restored.project_name == "Synthetic reporting study"\n    assert len(restored.annotations) == 1\n    assert restored.analyses == {}',
          )
          replace_once(
              "studio/tests/test_reporting_reproducibility.py",
              '    updated = state.with_operation("report_checkpoint", purpose="test")\n    assert len(updated.provenance) == before + 1',
              '    named = state.with_project_name("Pilot project")\n    assert named.project_name == "Pilot project"\n    assert named.provenance[-1]["operation"] == "set_project_name"\n    with pytest.raises(ValueError, match="non-empty"):\n        state.with_project_name("   ")\n    updated = state.with_operation("report_checkpoint", purpose="test")\n    assert len(updated.provenance) == before + 1',
          )
          PY

      - name: Install focused test dependencies
        run: python -m pip install -e ".[studio,dev]"

      - name: Validate project identity and launch helpers
        run: python -m pytest -q studio/tests/test_reporting_reproducibility.py studio/tests/test_desktop.py studio/tests/test_cli.py

      - name: Commit validated changes and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/studio-project-identity-helper.yml
          git add studio/reporting_services.py studio/app.py studio/tests/test_reporting_reproducibility.py .github/workflows/studio-project-identity-helper.yml
          git commit -m "feat(studio): persist project identity across recipes"
          git push origin HEAD:studio/product-polish-0.1.6
