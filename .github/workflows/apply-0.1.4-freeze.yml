name: apply-0.1.4-freeze

on:
  push:
    branches: [release-0.1.4-freeze]

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release-0.1.4-freeze
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply stable version substitutions
        run: |
          python - <<'PY'
          from pathlib import Path

          suffixes = {'.py', '.md', '.json', '.yml', '.yaml', '.toml', '.cff'}
          paths = []
          for root in [Path('src'), Path('tests'), Path('docs'), Path('scripts')]:
              paths.extend(p for p in root.rglob('*') if p.is_file() and p.suffix in suffixes)
          paths.extend([
              Path('README.md'), Path('CHANGELOG.md'), Path('VALIDATION.md'),
              Path('RELEASE_CHECKLIST.md'), Path('.zenodo.json'),
              Path('pyproject.toml'), Path('CITATION.cff'),
          ])

          for path in paths:
              text = path.read_text(encoding='utf-8')
              if '0.1.4.dev0' in text:
                  path.write_text(text.replace('0.1.4.dev0', '0.1.4'), encoding='utf-8')

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          old = 'VersionDOI = "https://doi.org/10.5281/zenodo.22313884"\nPreviousVersionDOI = "https://doi.org/10.5281/zenodo.22150873"\n'
          new = 'PreviousVersionDOI = "https://doi.org/10.5281/zenodo.22313884"\n'
          if old not in text:
              raise SystemExit('Expected development DOI block not found in pyproject.toml')
          pyproject.write_text(text.replace(old, new), encoding='utf-8')

          cff = Path('CITATION.cff')
          text = cff.read_text(encoding='utf-8')
          text = text.replace('version: 0.1.3\n', 'version: 0.1.4\n')
          text = text.replace('date-released: 2026-09-05\n', 'date-released: 2026-09-06\n')
          text = text.replace('doi: 10.5281/zenodo.22313884\n', '')
          cff.write_text(text, encoding='utf-8')

          zenodo = Path('.zenodo.json')
          text = zenodo.read_text(encoding='utf-8').replace(
              'The 0.1.4 development line preserves', 'Version 0.1.4 preserves'
          )
          zenodo.write_text(text, encoding='utf-8')

          post = Path('tests/test_post_release_completeness.py')
          text = post.read_text(encoding='utf-8').replace(
              'def test_development_version_and_contract():',
              'def test_release_version_and_contract():',
          )
          post.write_text(text, encoding='utf-8')

          offenders = []
          for path in paths:
              if path.exists() and '0.1.4.dev' in path.read_text(encoding='utf-8'):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit('Development literals remain: ' + ', '.join(offenders))

          assert 'version = "0.1.4"' in Path('pyproject.toml').read_text(encoding='utf-8')
          assert '__version__ = "0.1.4"' in Path('src/gpbiometricspy/__init__.py').read_text(encoding='utf-8')
          assert '"version": "0.1.4"' in Path('.zenodo.json').read_text(encoding='utf-8')
          assert 'version: 0.1.4' in Path('CITATION.cff').read_text(encoding='utf-8')
          assert 'doi: 10.5281/zenodo.22313884' not in Path('CITATION.cff').read_text(encoding='utf-8')
          print('stable version substitutions PASS')
          PY
      - name: Validate stable identity
        run: |
          python scripts/audit_release_identity.py
          python -m compileall -q src tests scripts
      - name: Commit stable version substitutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: promote gpbiometricspy 0.1.4 [freeze-applied]"
          git push origin HEAD:release-0.1.4-freeze
