name: pypi

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to publish to PyPI
        required: true
        type: string
  release:
    types: [published]

jobs:
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Download exact GitHub Release distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release view "$PUBLISH_TAG" --json isDraft,tagName --jq 'select(.isDraft == false) | .tagName' | grep -Fx "$PUBLISH_TAG"
          gh release download "$PUBLISH_TAG" --pattern '*.whl' --pattern '*.tar.gz' --dir dist

      - name: Verify tag, version, and distributions
        run: |
          set -euo pipefail
          case "$PUBLISH_TAG" in
            v*) VERSION="${PUBLISH_TAG#v}" ;;
            *) echo "Release tag must start with v: $PUBLISH_TAG" >&2; exit 1 ;;
          esac
          test -f "dist/gpbiometricspy-${VERSION}-py3-none-any.whl"
          test -f "dist/gpbiometricspy-${VERSION}.tar.gz"
          python -m pip install "twine==7.0.0"
          python -m twine check dist/*
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["PUBLISH_TAG"]
          version = tag.removeprefix("v")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          if project["name"] != "gpbiometricspy":
              raise SystemExit(f"Unexpected project name: {project['name']}")
          if project["version"] != version:
              raise SystemExit(f"Tag/version mismatch: {tag} vs {project['version']}")
          print(f"Verified gpbiometricspy {version} for PyPI publication")
          PY

      - name: Publish distributions to PyPI
        # PyPA gh-action-pypi-publish v1.14.2, pinned to its verified release commit.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
