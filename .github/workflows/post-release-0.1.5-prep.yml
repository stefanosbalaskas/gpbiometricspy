name: closeout-prep

"on":
  push:
    branches:
      - post-release-0.1.5-closeout
    paths:
      - ".github/workflows/post-release-0.1.5-prep.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: post-release-0.1.5-closeout
          fetch-depth: 0
      - name: Apply deterministic closeout preparation
        run: python scripts/_post_release_015_prep.py
      - name: Audit identity and diff
        run: |
          python scripts/audit_release_identity.py
          git diff --check
      - name: Commit prepared branch without temporary editors
        run: |
          rm scripts/_post_release_015_prep.py
          rm .github/workflows/post-release-0.1.5-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare 0.1.5 post-release closeout"
          git push origin HEAD:post-release-0.1.5-closeout
