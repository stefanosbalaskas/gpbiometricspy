name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to build and release
        required: true
        type: string
  push:
    tags: ['v*']

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify tag, workflow identity, current main and package version
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) VERSION="${RELEASE_TAG#v}" ;;
            *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          TARGET_SHA="$(git rev-parse HEAD)"
          test "$TARGET_SHA" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "${GITHUB_SHA,,}" = "$TARGET_SHA" || {
            echo "Release workflow must itself run on the exact release tag/commit." >&2
            echo "workflow SHA: ${GITHUB_SHA,,}; tag SHA: $TARGET_SHA" >&2
            exit 1
          }
          git fetch origin main --force
          MAIN_SHA="$(git rev-parse origin/main)"
          test "$TARGET_SHA" = "$MAIN_SHA" || {
            echo "Release tag $RELEASE_TAG points to $TARGET_SHA, but current main is $MAIN_SHA." >&2
            exit 1
          }
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          python - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')
          if re.fullmatch(r'\d+\.\d+\.\d+', version) is None:
              raise SystemExit(f"Stable release tag must be vX.Y.Z: {tag}")
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          if project['version'] != version:
              raise SystemExit(f"Tag/version mismatch: {tag} vs {project['version']}")
          PY

      - name: Verify archival metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          zenodo = json.loads(Path('.zenodo.json').read_text(encoding='utf-8'))
          if zenodo.get('version') != version:
              raise SystemExit(f"Zenodo version mismatch: {zenodo.get('version')} vs {version}")
          if zenodo.get('upload_type') != 'software':
              raise SystemExit('Zenodo metadata must declare upload_type=software')
          if zenodo.get('access_right') != 'open':
              raise SystemExit('Zenodo metadata must declare open access')
          if zenodo.get('license') != 'mit':
              raise SystemExit('Zenodo metadata must declare the MIT license')
          creators = zenodo.get('creators', [])
          if not creators or creators[0].get('orcid') != '0000-0003-2444-9796':
              raise SystemExit('Zenodo creator ORCID is missing or incorrect')
          expected = {
              'identifier': 'https://doi.org/10.5281/zenodo.21434608',
              'relation': 'isDerivedFrom',
          }
          if expected not in zenodo.get('related_identifiers', []):
              raise SystemExit('Frozen R reference DOI provenance is missing')

          cff = Path('CITATION.cff').read_text(encoding='utf-8')
          if f'version: {version}' not in cff:
              raise SystemExit(f'CITATION.cff version does not match release {version}')
          if 'https://orcid.org/0000-0003-2444-9796' not in cff:
              raise SystemExit('CITATION.cff ORCID is missing')
          if '10.5281/zenodo.21434608' in cff:
              raise SystemExit('R reference DOI must not be presented as the Python software identifier')
          PY

      - name: Require successful package validation runs on exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in \
            tests.yml \
            docs.yml \
            codeql.yml \
            deep-parity.yml \
            interoperability.yml \
            branch-coverage.yml \
            real-data-validation.yml \
            studio.yml \
            studio-e2e.yml \
            studio-production.yml; do
            echo "Checking $workflow for $TARGET_SHA on main..."
            ok="$(gh run list --workflow "$workflow" --commit "$TARGET_SHA" --branch main --limit 30 \
              --json event,conclusion \
              --jq '[.[] | select(.event == "push" and .conclusion == "success")] | length')"
            test "$ok" -ge 1 || { echo "Missing successful exact-main validation for $workflow" >&2; exit 1; }
          done

      - name: Install build and validation tools
        run: python -m pip install "build>=1.2" "twine==7.0.0"

      - name: Pin reproducible build epoch to source commit
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify Studio is present in release distributions
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path('dist').glob('gpbiometricspy-*.whl'))
          with zipfile.ZipFile(wheel) as zf:
              wheel_names = set(zf.namelist())
          wheel_required = {
              'studio/__init__.py',
              'studio/app.py',
              'studio/cli.py',
              'studio/public_demo.py',
              'studio/modules/__init__.py',
              'studio/www/studio.css',
              'studio/www/public-demo.css',
          }
          missing = sorted(wheel_required - wheel_names)
          if missing:
              raise SystemExit(f'Studio files missing from wheel: {missing}')

          sdist = next(Path('dist').glob('gpbiometricspy-*.tar.gz'))
          with tarfile.open(sdist, 'r:gz') as tf:
              sdist_names = set(tf.getnames())
          root = next(name.split('/', 1)[0] for name in sdist_names if '/studio/app.py' in name)
          sdist_required = {
              f'{root}/app.py',
              f'{root}/requirements.txt',
              f'{root}/DEPLOYMENT.md',
              f'{root}/studio/app.py',
              f'{root}/studio/public_demo.py',
          }
          missing = sorted(sdist_required - sdist_names)
          if missing:
              raise SystemExit(f'Studio deployment assets missing from sdist: {missing}')
          PY

      - name: Smoke-install wheel and sdist
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          export VERSION
          for artifact in "dist/gpbiometricspy-${VERSION}-py3-none-any.whl" "dist/gpbiometricspy-${VERSION}.tar.gz"; do
            envdir="$(mktemp -d)"
            python -m venv "$envdir/venv"
            "$envdir/venv/bin/python" -m pip install --upgrade pip
            "$envdir/venv/bin/python" -m pip install "$artifact"
            "$envdir/venv/bin/python" - <<'PY'
          import os
          from importlib.metadata import distribution
          import gpbiometricspy as gp

          assert gp.__version__ == os.environ["VERSION"]
          assert len(gp.R_EXPORTS) == 406
          assert len(gp.IMPLEMENTED_EXPORTS) == 406
          assert len(gp.PENDING_EXPORTS) == 0
          dist = distribution("gpbiometricspy")
          paths = {str(item) for item in (dist.files or [])}
          assert "studio/app.py" in paths
          scripts = {ep.name: ep.value for ep in dist.entry_points if ep.group == "console_scripts"}
          assert scripts.get("gpbiometricspy-studio") == "studio.cli:main"
          assert scripts.get("gpbiometricspy-studio-public") == "studio.cli:main_public"
          print("distribution smoke PASS", gp.__version__)
          PY
            rm -rf "$envdir"
          done

      - name: Write SHA-256 package manifest
        run: sha256sum dist/* > SHA256SUMS.txt

      - name: Write and validate canonical stable-release metadata
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open('rb') as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          packages = []
          for path in sorted(Path('dist').iterdir()):
              if path.is_file():
                  packages.append({'path': path.as_posix(), 'sha256': sha256(path)})
          metadata = {
              'schema': 'gpbiometricspy-stable-release-artifact',
              'schema_version': 2,
              'release_tag': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['TARGET_SHA'].lower(),
              'distribution_checksums_sha256': sha256(Path('SHA256SUMS.txt')),
              'packages': packages,
          }
          Path('RELEASE-METADATA.json').write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          python tools/release/validate_stable_release_artifact.py \
            --root . \
            --manifest RELEASE-METADATA.json \
            --expected-tag "$RELEASE_TAG" \
            --expected-source-commit "$TARGET_SHA"

      - name: Create or verify immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; verifying every canonical package asset before reuse."
            rm -rf existing-release
            mkdir -p existing-release/dist
            gh release download "$RELEASE_TAG" \
              --pattern "gpbiometricspy-${VERSION}-py3-none-any.whl" \
              --pattern "gpbiometricspy-${VERSION}.tar.gz" \
              --dir existing-release/dist
            gh release download "$RELEASE_TAG" \
              --pattern "SHA256SUMS.txt" \
              --pattern "RELEASE-METADATA.json" \
              --dir existing-release
            (
              cd existing-release
              sha256sum -c SHA256SUMS.txt
            )
            python tools/release/validate_stable_release_artifact.py \
              --root existing-release \
              --manifest existing-release/RELEASE-METADATA.json \
              --expected-tag "$RELEASE_TAG" \
              --expected-source-commit "$TARGET_SHA"
            for rel in \
              "dist/gpbiometricspy-${VERSION}-py3-none-any.whl" \
              "dist/gpbiometricspy-${VERSION}.tar.gz" \
              "SHA256SUMS.txt" \
              "RELEASE-METADATA.json"; do
              cmp --silent "$rel" "existing-release/$rel" || {
                echo "Existing immutable release asset differs from the exact-source candidate: $rel" >&2
                exit 1
              }
            done
            echo "Existing GitHub Release assets are byte-identical to the validated exact-source candidate."
          else
            gh release create "$RELEASE_TAG" \
              dist/* \
              SHA256SUMS.txt \
              RELEASE-METADATA.json \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Upload canonical release artifact for downstream trusted publication
        uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: |
            dist/*
            SHA256SUMS.txt
            RELEASE-METADATA.json
          if-no-files-found: error
          retention-days: 90
