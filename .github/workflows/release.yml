name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (optional)
        required: false
        type: string
  push:
    tags: ['v*']

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Verify tag and package version
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v*) VERSION="${RELEASE_TAG#v}" ;;
            *) echo "Release tag must start with v: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          python - <<'PY'
          import os, pathlib, tomllib
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          if project['version'] != version:
              raise SystemExit(f"Tag/version mismatch: {os.environ['RELEASE_TAG']} vs {project['version']}")
          PY

      - name: Verify archival metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import os
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          zenodo = json.loads(Path('.zenodo.json').read_text(encoding='utf-8'))
          if zenodo.get('version') != version:
              raise SystemExit(f"Zenodo version mismatch: {zenodo.get('version')} vs {version}")
          if zenodo.get('upload_type') != 'software':
              raise SystemExit('Zenodo metadata must declare upload_type=software')
          if zenodo.get('access_right') != 'open':
              raise SystemExit('Zenodo metadata must declare open access')
          if zenodo.get('license') != 'mit':
              raise SystemExit('Zenodo metadata must declare the MIT license')
          creators = zenodo.get('creators', [])
          if not creators or creators[0].get('orcid') != '0000-0003-2444-9796':
              raise SystemExit('Zenodo creator ORCID is missing or incorrect')
          expected = {
              'identifier': 'https://doi.org/10.5281/zenodo.21434608',
              'relation': 'isDerivedFrom',
          }
          if expected not in zenodo.get('related_identifiers', []):
              raise SystemExit('Frozen R reference DOI provenance is missing')

          cff = Path('CITATION.cff').read_text(encoding='utf-8')
          if f'version: {version}' not in cff:
              raise SystemExit(f'CITATION.cff version does not match release {version}')
          if 'https://orcid.org/0000-0003-2444-9796' not in cff:
              raise SystemExit('CITATION.cff ORCID is missing')
          if '10.5281/zenodo.21434608' in cff:
              raise SystemExit('R reference DOI must not be presented as the Python software identifier')
          PY

      - name: Require successful automated validation runs on exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          for workflow in \
            tests.yml \
            docs.yml \
            codeql.yml \
            deep-parity.yml \
            interoperability.yml \
            branch-coverage.yml \
            real-data-validation.yml \
            studio.yml \
            studio-e2e.yml \
            studio-production.yml \
            studio-packaging.yml \
            studio-signing-readiness.yml \
            studio-installer-readiness.yml \
            studio-windowed-readiness.yml \
            studio-windowed-installer-readiness.yml \
            studio-release-provenance-readiness.yml \
            studio-release-orchestration-readiness.yml \
            studio-desktop-release-handoff-readiness.yml; do
            echo "Checking $workflow for $TARGET_SHA on main..."
            ok="$(gh run list --workflow "$workflow" --commit "$TARGET_SHA" --branch main --limit 30 \
              --json event,conclusion \
              --jq '[.[] | select(.event == "push" and .conclusion == "success")] | length')"
            test "$ok" -ge 1 || { echo "Missing successful exact-main validation for $workflow" >&2; exit 1; }
          done

      - name: Resolve validated production desktop handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          HANDOFF_RUN_ID="$(gh run list --workflow studio-production-release-handoff.yml \
            --commit "$TARGET_SHA" --branch main --limit 30 \
            --json databaseId,event,conclusion,createdAt \
            --jq '[.[] | select(.event == "workflow_dispatch" and .conclusion == "success")] | sort_by(.createdAt) | last | .databaseId // empty')"
          test -n "$HANDOFF_RUN_ID" || {
            echo "Missing successful production desktop handoff for $TARGET_SHA" >&2
            exit 1
          }
          echo "HANDOFF_RUN_ID=$HANDOFF_RUN_ID" >> "$GITHUB_ENV"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Download and revalidate production desktop handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-handoff
          gh run download "$HANDOFF_RUN_ID" \
            --name "studio-production-release-handoff-evidence-$TARGET_SHA" \
            --dir release-handoff
          (
            cd release-handoff
            sha256sum -c DESKTOP-HANDOFF-SHA256SUMS.txt
          )
          python tools/release/validate_desktop_release_evidence.py \
            --manifest release-handoff/desktop-production-release-evidence.json \
            --expected-tag "$RELEASE_TAG" \
            --expected-source-commit "$TARGET_SHA"

      - name: Install build and validation tools
        run: python -m pip install "build>=1.2" "twine==7.0.0"

      - name: Build distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify Studio is present in release distributions
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = next(Path('dist').glob('gpbiometricspy-*.whl'))
          with zipfile.ZipFile(wheel) as zf:
              wheel_names = set(zf.namelist())
          wheel_required = {
              'studio/__init__.py',
              'studio/app.py',
              'studio/cli.py',
              'studio/public_demo.py',
              'studio/modules/__init__.py',
              'studio/www/studio.css',
              'studio/www/public-demo.css',
          }
          missing = sorted(wheel_required - wheel_names)
          if missing:
              raise SystemExit(f'Studio files missing from wheel: {missing}')

          sdist = next(Path('dist').glob('gpbiometricspy-*.tar.gz'))
          with tarfile.open(sdist, 'r:gz') as tf:
              sdist_names = set(tf.getnames())
          root = next(name.split('/', 1)[0] for name in sdist_names if '/studio/app.py' in name)
          sdist_required = {
              f'{root}/app.py',
              f'{root}/requirements.txt',
              f'{root}/DEPLOYMENT.md',
              f'{root}/studio/app.py',
              f'{root}/studio/public_demo.py',
          }
          missing = sorted(sdist_required - sdist_names)
          if missing:
              raise SystemExit(f'Studio deployment assets missing from sdist: {missing}')
          PY

      - name: Smoke-install wheel and sdist
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          export VERSION
          for artifact in "dist/gpbiometricspy-${VERSION}-py3-none-any.whl" "dist/gpbiometricspy-${VERSION}.tar.gz"; do
            envdir="$(mktemp -d)"
            python -m venv "$envdir/venv"
            "$envdir/venv/bin/python" -m pip install --upgrade pip
            "$envdir/venv/bin/python" -m pip install "$artifact"
            "$envdir/venv/bin/python" - <<'PY'
          import os
          from importlib.metadata import distribution
          import gpbiometricspy as gp

          assert gp.__version__ == os.environ["VERSION"]
          assert len(gp.R_EXPORTS) == 406
          assert len(gp.IMPLEMENTED_EXPORTS) == 406
          assert len(gp.PENDING_EXPORTS) == 0
          dist = distribution("gpbiometricspy")
          paths = {str(item) for item in (dist.files or [])}
          assert "studio/app.py" in paths
          scripts = {ep.name: ep.value for ep in dist.entry_points if ep.group == "console_scripts"}
          assert scripts.get("gpbiometricspy-studio") == "studio.cli:main"
          assert scripts.get("gpbiometricspy-studio-public") == "studio.cli:main_public"
          print("distribution smoke PASS", gp.__version__)
          PY
            rm -rf "$envdir"
          done

      - name: Write SHA-256 manifest
        run: sha256sum dist/* > SHA256SUMS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: |
            dist/*
            SHA256SUMS.txt
            release-handoff/desktop-production-release-evidence.json
            release-handoff/DESKTOP-HANDOFF-SHA256SUMS.txt

      - name: Create immutable GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; preserving existing assets unchanged."
          else
            prerelease=()
            if [[ "$RELEASE_TAG" == *".dev"* ]]; then prerelease+=(--prerelease); fi
            gh release create "$RELEASE_TAG" \
              dist/* \
              SHA256SUMS.txt \
              release-handoff/desktop-production-release-evidence.json \
              release-handoff/DESKTOP-HANDOFF-SHA256SUMS.txt \
              --verify-tag --title "$RELEASE_TAG" --generate-notes "${prerelease[@]}"
          fi

      - name: Dispatch protected PyPI Trusted Publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          if curl --fail --silent --show-error "https://pypi.org/pypi/gpbiometricspy/${VERSION}/json" >/dev/null 2>&1; then
            echo "gpbiometricspy ${VERSION} is already on PyPI; skipping duplicate publication dispatch."
          else
            gh workflow run pypi.yml --ref "$RELEASE_TAG" -f tag="$RELEASE_TAG"
            echo "Dispatched pypi.yml for $RELEASE_TAG"
          fi
