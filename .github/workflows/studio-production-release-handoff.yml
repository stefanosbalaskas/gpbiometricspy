name: studio-production-release-handoff

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to authorize (vX.Y.Z)
        required: true
        type: string
      source_commit:
        description: Exact 40-character current-main commit to authorize
        required: true
        type: string
      evidence_json:
        description: Completed non-secret production desktop handoff JSON record
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: studio-production-release-handoff-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  validate-production-handoff:
    name: validate-production-release-handoff
    runs-on: ubuntu-latest
    environment: production-release
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      EVIDENCE_JSON: ${{ inputs.evidence_json }}
    steps:
      - name: Checkout exact proposed release commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Verify exact current-main stable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "source_commit must be an exact 40-character Git SHA" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release_tag must be a stable vX.Y.Z tag" >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "${SOURCE_COMMIT,,}"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "${SOURCE_COMMIT,,}"
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if re.fullmatch(r"\d+\.\d+\.\d+", version) is None:
              raise SystemExit(f"Package version is not stable X.Y.Z: {version}")
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
          PY

      - name: Materialize non-secret handoff evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/desktop-production-handoff"
          python - <<'PY'
          import os
          from pathlib import Path

          payload = os.environ["EVIDENCE_JSON"]
          path = Path(os.environ["RUNNER_TEMP"]) / "desktop-production-handoff" / "desktop-production-release-evidence.json"
          path.write_text(payload, encoding="utf-8")
          PY

      - name: Reject secret material in handoff record
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/desktop-production-handoff/desktop-production-release-evidence.json"
          if grep -Eiq -- 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BEGIN PKCS12|"private_key"|"password"|"client_secret"|"access_token"' "$evidence"; then
            echo "Production handoff record contains material that looks secret; refusing to persist it." >&2
            exit 1
          fi

      - name: Validate exact-source production handoff
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/desktop-production-handoff/desktop-production-release-evidence.json"
          python tools/release/validate_desktop_release_evidence.py \
            --manifest "$evidence" \
            --expected-tag "$RELEASE_TAG" \
            --expected-source-commit "$SOURCE_COMMIT"
          (
            cd "$RUNNER_TEMP/desktop-production-handoff"
            sha256sum desktop-production-release-evidence.json > DESKTOP-HANDOFF-SHA256SUMS.txt
          )

      - name: Upload validated production handoff evidence
        uses: actions/upload-artifact@v6
        with:
          name: studio-production-release-handoff-evidence-${{ inputs.source_commit }}
          path: |
            ${{ runner.temp }}/desktop-production-handoff/desktop-production-release-evidence.json
            ${{ runner.temp }}/desktop-production-handoff/DESKTOP-HANDOFF-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
