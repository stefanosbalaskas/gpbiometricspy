name: apply-post-release-closeout

on:
  push:
    branches:
      - post-release-0.1.3-closeout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: post-release-0.1.3-closeout
          fetch-depth: 0

      - name: Apply post-release closeout
        run: python scripts/apply_post_release_closeout.py

      - name: Commit closeout edits
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml .zenodo.json CITATION.cff README.md RELEASE_CHECKLIST.md RELEASE_NOTES_0.1.3.md VALIDATION.md docs src scripts tests
          git diff --cached --check
          git commit -m "chore: close out 0.1.3 release and open 0.1.4 development"
          git push origin HEAD:post-release-0.1.3-closeout
