name: public-pypi-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - post-release/public-pypi-0.1.6
    paths:
      - ".github/workflows/public-pypi-smoke.yml"
      - "scripts/public_pypi_smoke.py"
      - "tests/test_public_pypi_smoke_wiring.py"
      - "RELEASE_CHECKLIST.md"
      - "docs/studio.md"
  pull_request:
    paths:
      - ".github/workflows/public-pypi-smoke.yml"
      - "scripts/public_pypi_smoke.py"
      - "tests/test_public_pypi_smoke_wiring.py"
      - "RELEASE_CHECKLIST.md"
      - "docs/studio.md"

permissions:
  contents: read

jobs:
  public-install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout smoke harness only
        uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Verify public PyPI metadata and bytes
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          import urllib.request

          version = "0.1.6"
          expected = {
              "gpbiometricspy-0.1.6-py3-none-any.whl": "087645e8fccd0885c0cd99fe1e0362f2d234f68f975b148cc9b8c64a2b8e2970",
              "gpbiometricspy-0.1.6.tar.gz": "c57ec464bbbb4b9444646e26e2abd02ff20e0a00e2b1ab8385bdf867eaa2eb25",
          }
          with urllib.request.urlopen(f"https://pypi.org/pypi/gpbiometricspy/{version}/json", timeout=30) as response:
              payload = json.load(response)
          assert payload["info"]["version"] == version
          files = {item["filename"]: item for item in payload["urls"]}
          assert set(files) == set(expected), sorted(files)
          target = Path("public-pypi-bytes")
          target.mkdir(exist_ok=True)
          for filename, digest in expected.items():
              item = files[filename]
              assert item["digests"]["sha256"] == digest
              with urllib.request.urlopen(item["url"], timeout=60) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              assert actual == digest, (filename, actual, digest)
              (target / filename).write_bytes(data)
              print(f"{filename}: {actual}")

      - name: Install exact stable release from the public index
        env:
          PIP_INDEX_URL: https://pypi.org/simple
          PIP_EXTRA_INDEX_URL: ""
          PIP_NO_CACHE_DIR: "1"
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: >-
          python -m pip install
          --no-cache-dir
          --index-url https://pypi.org/simple
          "gpbiometricspy[studio]==0.1.6"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Exercise installed scientific contract and Studio launchers
        working-directory: ${{ runner.temp }}
        run: python "${{ github.workspace }}/scripts/public_pypi_smoke.py" --expected-version 0.1.6
