name: branch-coverage

on:
  pull_request:
    paths:
      - "src/gpbiometricspy/**"
      - "tests/**"
      - "scripts/report_branch_coverage.py"
      - ".github/workflows/branch-coverage.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Run full suite with branch coverage
        run: |
          python -m pytest -q \
            --cov=src/gpbiometricspy \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=json:coverage-branch.json
      - name: Report branch debt
        run: python scripts/report_branch_coverage.py coverage-branch.json --top 30
