name: fix-0.1.4-release-doc-helper

on:
  push:
    branches: [release-0.1.4-freeze]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release-0.1.4-freeze
          fetch-depth: 0
      - name: Tighten helper assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-0.1.4-release-docs.yml')
          text = path.read_text(encoding='utf-8')
          old = "          assert 'VersionDOI =' not in read('pyproject.toml')"
          new = "          assert '\\nVersionDOI = ' not in ('\\n' + read('pyproject.toml'))"
          if old not in text:
              raise SystemExit('Expected broad VersionDOI assertion not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix and remove fixer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-0.1.4-release-doc-helper.yml
          git add .github/workflows/apply-0.1.4-release-docs.yml
          git commit -m "ci: fix 0.1.4 release-doc helper assertion"
          git push origin HEAD:release-0.1.4-freeze
