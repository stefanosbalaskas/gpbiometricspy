name: prepare-post-0.1.6-publication-recovery

on:
  push:
    branches:
      - release/pypi-dispatch-hardening
    paths:
      - tools/release/prepare_post_0_1_6.py
      - .github/workflows/prepare-post-0.1.6.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply deterministic post-release transition
        run: python tools/release/prepare_post_0_1_6.py

      - name: Install focused validation dependencies
        run: python -m pip install -e ".[dev,studio-test]"

      - name: Validate live identity and frozen contract
        run: |
          python scripts/audit_release_identity.py
          python scripts/audit_r_contract.py
          python -m pytest -q \
            tests/test_post_release_completeness.py \
            tests/test_coverage_completion_remaining_core.py \
            tests/test_production_release_handoff_wiring.py \
            tests/test_stable_release_artifact_contract.py

      - name: Remove preparation machinery and commit final candidate
        env:
          BRANCH: release/pypi-dispatch-hardening
        run: |
          set -euo pipefail
          rm -f tools/release/prepare_post_0_1_6.py
          rm -f .github/workflows/prepare-post-0.1.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): recover 0.1.6 publication and advance development"
          git push origin "HEAD:$BRANCH"
