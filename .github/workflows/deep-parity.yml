name: deep-parity

on:
  pull_request:
  workflow_dispatch:

jobs:
  r-python-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: r-lib/actions/setup-r@v2
      - name: Install Python package
        run: python -m pip install -e .
      - name: Install R JSON dependency
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      - name: Generate Python golden fixtures
        run: python scripts/generate_python_golden.py --output artifacts/golden/python.json
      - name: Generate R golden fixtures
        run: Rscript reference/golden/generate_r_golden.R artifacts/golden/r.json
      - name: Compare golden fixtures
        run: python scripts/compare_golden_fixtures.py artifacts/golden/r.json artifacts/golden/python.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: golden-fixtures
          path: artifacts/golden/*.json
