name: studio

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'pyproject.toml'
      - '.github/workflows/studio.yml'
  pull_request:
    paths:
      - 'studio/**'
      - 'pyproject.toml'
      - '.github/workflows/studio.yml'

jobs:
  studio-smoke:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Studio
        run: python -m pip install -e ".[dev,studio]"
      - name: Ruff
        run: ruff check studio
      - name: Compile
        run: python -m compileall -q studio
      - name: Studio tests
        run: python -m pytest -q studio/tests
