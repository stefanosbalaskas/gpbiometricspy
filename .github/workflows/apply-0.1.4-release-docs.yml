name: apply-0.1.4-release-docs

on:
  push:
    branches: [release-0.1.4-freeze]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release-0.1.4-freeze
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Finalize release-facing metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_required(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              write(path, text.replace(old, new))

          readme = read('README.md')
          old_status = '| Stable release | **0.1.3** |\n| Development head | **0.1.4** |\n| Release date | **2026-09-05** |'
          new_status = '| Stable release | **0.1.4** |\n| Release date | **2026-09-06** |'
          if old_status not in readme:
              raise SystemExit('README status block mismatch')
          readme = readme.replace(old_status, new_status)
          readme = readme.replace('In stable `0.1.3`, it is included in the Python distribution with installed launch commands.', 'In stable `0.1.4`, it is included in the Python distribution with installed launch commands.')
          old_archive = '`gpbiometricspy 0.1.3` is the current stable release. Its version-specific Zenodo DOI is **10.5281/zenodo.22313884**; the concept DOI identifies the evolving Python software record.\n\n- **Software concept DOI:** [10.5281/zenodo.22150872](https://doi.org/10.5281/zenodo.22150872)\n- **Previous version DOI (0.1.2):** [10.5281/zenodo.22150873](https://doi.org/10.5281/zenodo.22150873)\n'
          new_archive = '`gpbiometricspy 0.1.4` is the current stable release. Its version-specific Zenodo DOI will be recorded after Zenodo ingests the immutable `v0.1.4` GitHub release; the concept DOI identifies the evolving Python software record.\n\n- **Software concept DOI:** [10.5281/zenodo.22150872](https://doi.org/10.5281/zenodo.22150872)\n- **Previous version DOI (0.1.3):** [10.5281/zenodo.22313884](https://doi.org/10.5281/zenodo.22313884)\n- **Earlier version DOI (0.1.2):** [10.5281/zenodo.22150873](https://doi.org/10.5281/zenodo.22150873)\n'
          if old_archive not in readme:
              raise SystemExit('README archival block mismatch')
          write('README.md', readme.replace(old_archive, new_archive))

          index = read('docs/index.md')
          old_grid = '<div><span class="gp-status-value">0.1.3</span><span class="gp-status-label">stable release</span></div>\n<div><span class="gp-status-value">0.1.4</span><span class="gp-status-label">development head</span></div>'
          new_grid = '<div><span class="gp-status-value">0.1.4</span><span class="gp-status-label">stable release</span></div>\n<div><span class="gp-status-value">2026-09-06</span><span class="gp-status-label">release date</span></div>'
          if old_grid not in index:
              raise SystemExit('docs/index status grid mismatch')
          index = index.replace(old_grid, new_grid)
          start = index.index('!!! info "Stable 0.1.3 + validated 0.1.4 development line"')
          end = index.index('\n\n## Code or Studio', start)
          info = '!!! info "Stable 0.1.4 release source"\n    This site is frozen from the validated `gpbiometricspy 0.1.4` release source (2026-09-06). The frozen scientific contract remains **406/406 exports with 0 pending**, with **557 tests**, **10,316/10,316 statements**, and **5,575/5,594 raw branches = 99.6604%**. The remaining **19** raw branch arcs are exact reviewed structural/caller-dominated entries; CI requires **0 unexpected**, **0 stale**, and **0 unaudited** branch debt. Raw coverage is not relabelled as 100%. The 0.1.4 version DOI will be added only after Zenodo ingests the immutable release; the software concept DOI remains [10.5281/zenodo.22150872](https://doi.org/10.5281/zenodo.22150872), and the previous 0.1.3 version DOI is [10.5281/zenodo.22313884](https://doi.org/10.5281/zenodo.22313884).'
          write('docs/index.md', index[:start] + info + index[end:])

          replace_required('docs/getting-started.md', '`0.1.3` is the stable public release; this documentation is frozen from the validated release source.', '`0.1.4` is the stable public release; this documentation is frozen from the validated release source.')
          replace_required('docs/plot-gallery.md', '<strong>Stable 0.1.3 documentation.</strong> This gallery is frozen from the validated <code>0.1.3</code> release source.', '<strong>Stable 0.1.4 documentation.</strong> This gallery is frozen from the validated <code>0.1.4</code> release source.')
          replace_required('docs/studio.md', 'The Studio application is included in the stable `0.1.3` distribution and requires the optional Shiny dependencies.', 'The Studio application is included in the stable `0.1.4` distribution and requires the optional Shiny dependencies.')

          citation_lines = [
              '# Citation and archival',
              '',
              '`gpbiometricspy` is archived through the Zenodo GitHub integration.',
              '',
              '<div class="gp-version-note">',
              '<strong>Current citation state:</strong> stable Python release <code>0.1.4</code> (2026-09-06). Its version-specific Zenodo DOI will be added after Zenodo ingests the immutable <code>v0.1.4</code> GitHub release; the software concept DOI remains the identifier for the evolving record.',
              '</div>',
              '',
              '## Cite the Python software',
              '',
              'For reproducibility, cite the exact software release used. During the short pre-ingestion window for 0.1.4, use the release/version metadata and repository tag; replace that with the minted 0.1.4 version DOI once Zenodo publishes it.',
              '',
              '- **0.1.4 version DOI:** pending Zenodo ingestion — **not invented in release metadata**',
              '- **Previous 0.1.3 version DOI:** **[10.5281/zenodo.22313884](https://doi.org/10.5281/zenodo.22313884)**',
              '- **Earlier 0.1.2 version DOI:** **[10.5281/zenodo.22150873](https://doi.org/10.5281/zenodo.22150873)**',
              '- **Software concept DOI:** **[10.5281/zenodo.22150872](https://doi.org/10.5281/zenodo.22150872)**',
              '',
              'Zenodo recommends the version DOI when citing a specific research artifact version. The concept DOI resolves to the evolving software record and is appropriate when referring to the software family.',
              '',
              'GitHub reads [`CITATION.cff`](https://github.com/stefanosbalaskas/gpbiometricspy/blob/main/CITATION.cff) for its **Cite this repository** control. The 0.1.4 release freeze records the stable version and release date but intentionally omits a version DOI until Zenodo mints one.',
              '',
              '## Published gpbiometrics paper',
              '',
              'The peer-reviewed paper describing the original R package is:',
              '',
              '> Balaskas, S. **gpbiometrics: An R Package for Reproducible Analysis and Reporting of Gazepoint Biometrics Exports.** *Signals* **2026**, *7*, 86. [https://doi.org/10.3390/signals7050086](https://doi.org/10.3390/signals7050086)',
              '',
              'This article documents the R `gpbiometrics` package that provides the scientific and software lineage for `gpbiometricspy`. When an analysis uses the Python package, cite the relevant `gpbiometricspy` software version as well; the R-package article is a related publication rather than a substitute for the Python software citation.',
              '',
              '## R reference provenance',
              '',
              'The frozen semantic reference is **gpbiometrics 2.0.0**, independently archived at DOI **[10.5281/zenodo.21434608](https://doi.org/10.5281/zenodo.21434608)**.',
              '',
              'That DOI identifies the R reference package. `.zenodo.json` preserves it with relation `isDerivedFrom`, so the Python and R software objects remain distinct.',
              '',
              '## Metadata files',
              '',
              '- `CITATION.cff` identifies stable Python release 0.1.4 and its release date; its version DOI is intentionally absent until Zenodo ingestion.',
              '- `.zenodo.json` provides Zenodo-specific archival metadata and the R-reference provenance relationship.',
              '- README and documentation use the Python concept DOI badge for the evolving software family while retaining prior version DOIs as historical identifiers.',
              '',
              '## Interpretation',
              '',
              'A Zenodo DOI provides a persistent identifier for a software archive. It does not replace the package\'s scientific validation evidence, which remains documented under [Parity & validation](parity.md) and [Deep validation](deep-validation.md).',
          ]
          write('docs/citation.md', '\n'.join(citation_lines) + '\n')

          changelog = read('CHANGELOG.md')
          old = 'refreshes repository-facing validation status for the 0.1.4 development freeze without changing the current public stable release identity (`0.1.3`) before the separate stable-version promotion.'
          new = 'promotes the fully qualified branch-validation line to stable **0.1.4** release metadata while preserving raw **99.6604%** branch reporting and the exact structural-debt contract.'
          if old not in changelog:
              raise SystemExit('CHANGELOG promotion line mismatch')
          write('CHANGELOG.md', changelog.replace(old, new))

          checklist = read('RELEASE_CHECKLIST.md')
          old_promote = '- [ ] Promote package identity from `0.1.4` to stable `0.1.4` only after this hardening PR is merged and exact-main development gates are green.'
          new_promote = '- [x] Promote the qualified 0.1.4 development identity to stable `0.1.4` only after the release-hardening tranche merged green.'
          if old_promote not in checklist:
              raise SystemExit('RELEASE_CHECKLIST promotion line mismatch')
          checklist = checklist.replace(old_promote, new_promote)
          checklist = checklist.replace('- [ ] Synchronize stable package, runtime `__version__`, Zenodo metadata, CFF citation metadata, generated documentation metadata, README/site, changelog, release notes and checklist without inventing a pre-ingestion 0.1.4 Zenodo version DOI.', '- [x] Synchronize stable package, runtime `__version__`, Zenodo metadata, CFF citation metadata, generated documentation metadata, README/site, changelog, release notes and checklist without inventing a pre-ingestion 0.1.4 Zenodo version DOI.')
          write('RELEASE_CHECKLIST.md', checklist)

          workflow = read('.github/workflows/docs.yml')
          start = workflow.index("          version_doi = urls['VersionDOI']")
          marker = "          assert f'doi: {previous_doi}' not in cff\n"
          end = workflow.index(marker, start) + len(marker)
          validator_lines = [
              "          version_doi_url = urls.get('VersionDOI')",
              "          previous_doi_url = urls.get('PreviousVersionDOI')",
              "          version_doi = version_doi_url.removeprefix('https://doi.org/') if version_doi_url else None",
              "          previous_doi = previous_doi_url.removeprefix('https://doi.org/') if previous_doi_url else None",
              "          stable = re.fullmatch(r'\\d+\\.\\d+\\.\\d+', project_version) is not None",
              '',
              "          z = json.loads(Path('.zenodo.json').read_text(encoding='utf-8'))",
              "          assert z['version'] == project_version",
              "          assert z['upload_type'] == 'software'",
              "          assert z['access_right'] == 'open'",
              "          assert z['license'] == 'mit'",
              "          assert z['creators'][0]['orcid'] == '0000-0003-2444-9796'",
              '          assert any(',
              "              item['identifier'] == 'https://doi.org/10.5281/zenodo.21434608'",
              "              and item['relation'] == 'isDerivedFrom'",
              "              for item in z['related_identifiers']",
              '          )',
              '',
              "          cff = Path('CITATION.cff').read_text(encoding='utf-8')",
              "          assert 'https://orcid.org/0000-0003-2444-9796' in cff",
              "          cff_version = re.search(r'(?m)^version:\\s*([^\\s]+)\\s*$', cff).group(1)",
              "          assert re.fullmatch(r'\\d+\\.\\d+\\.\\d+', cff_version)",
              "          cff_doi_match = re.search(r'(?m)^doi:\\s*([^\\s]+)\\s*$', cff)",
              "          cff_doi = cff_doi_match.group(1) if cff_doi_match else None",
              '          if stable:',
              '              assert cff_version == project_version',
              '              if version_doi is None:',
              '                  assert cff_doi is None',
              '              else:',
              '                  assert cff_doi == version_doi',
              '          else:',
              '              assert version_doi is not None',
              '              assert cff_doi == version_doi',
              '          if previous_doi is not None:',
              '              assert cff_doi != previous_doi',
          ]
          workflow = workflow[:start] + '\n'.join(validator_lines) + '\n' + workflow[end:]
          write('.github/workflows/docs.yml', workflow)

          validation = read('VALIDATION.md')
          heading = '## 0.1.4 stable release freeze — 2026-09-06'
          if heading not in validation:
              section = [
                  '', '', heading, '',
                  'The 0.1.4 release source freezes the completed branch/path-validation campaign without changing the frozen 406-function scientific contract.', '',
                  '- package/runtime identity: **0.1.4**;',
                  '- frozen R semantic reference: **gpbiometrics 2.0.0**;',
                  '- API contract: **406 / 406 implemented; 0 pending**;',
                  '- scientific regression suite: **557 tests**;',
                  '- whole-package statements: **10,316 / 10,316 = 100.000%** with a **100% statement CI floor**;',
                  '- raw pure branches: **5,575 / 5,594 = 99.6604%** with a **99.6% raw branch CI floor**;',
                  '- audited structural/caller-dominated residual arcs: **19**;',
                  '- structural-debt contract: **0 unexpected, 0 stale, 0 unaudited branch debt**;',
                  '- audited branch accounting: **5,594 / 5,594 = 100.0000%**, explicitly not substituted for the honest raw coverage metric;',
                  '- exact release automation requires tests, branch/structural audit, docs, CodeQL, deep parity, interoperability, private-real-data validation, Studio smoke, Studio Chromium E2E, and Studio production/distribution on the same stable `main` commit before tagging;',
                  '- no 0.1.4 Zenodo version DOI is recorded before Zenodo actually ingests the immutable GitHub release.',
              ]
              validation += '\n'.join(section) + '\n'
          write('VALIDATION.md', validation)

          notes = [
              '# gpbiometricspy 0.1.4 — branch-path validation and release hardening', '',
              '`gpbiometricspy 0.1.4` preserves the frozen **gpbiometrics 2.0.0** scientific contract while substantially strengthening executable path validation and release governance.', '',
              '## Scientific contract', '',
              '- **406 / 406** frozen R exports implemented; **0 pending**.',
              '- **557** scientific regression tests.',
              '- **10,316 / 10,316 statements = 100.00%** with a 100% statement CI floor.',
              '- No intended scientific API redesign in this release line.', '',
              '## Branch/path validation', '',
              '- Raw pure branch coverage increased from the original 0.1.4 baseline **4,815 / 5,594 = 86.0744%** to **5,575 / 5,594 = 99.6604%**.',
              '- **760** additional branch paths were validated through exported/public behavior where genuinely reachable.',
              '- The remaining **19** raw arcs are explicitly reviewed structural/caller-dominated or dominated defensive paths.',
              '- CI enforces an exact machine-readable structural-debt contract: **0 unexpected**, **0 stale**, **0 unaudited branch debt**.',
              '- Audited accounting is **5,594 / 5,594**, while the release continues to report the literal raw Coverage.py metric as **99.6604%** rather than relabelling it as 100%.', '',
              '## Release integrity', '',
              '- Branch/structural coverage is now a first-class exact-commit stable-release gate alongside the OS×Python matrix, docs, CodeQL, deep parity, interoperability, private-data validation, and Studio gates.',
              '- `pyproject.toml` changes trigger the branch audit so dependency/runtime metadata cannot bypass path validation.',
              '- Release identity is synchronized across package metadata, runtime `__version__`, `.zenodo.json`, `CITATION.cff`, generated documentation metadata, README/site, changelog, and validation records.',
              '- `CITATION.cff` deliberately contains no 0.1.4 version DOI before Zenodo ingestion. The actual DOI will be recorded only after Zenodo mints it.', '',
              '## Studio and interoperability', '',
              'The packaged Shiny for Python Studio, synthetic-only public boundary, Chromium E2E checks, production/distribution checks, deep R/Python parity, and optional-backend interoperability gates remain part of the stable release contract.',
          ]
          write('RELEASE_NOTES_0.1.4.md', '\n'.join(notes) + '\n')
          release_doc = [
              '# gpbiometricspy 0.1.4', '',
              'Released **2026-09-06**.', '',
              'See the repository [0.1.4 release notes](https://github.com/stefanosbalaskas/gpbiometricspy/blob/main/RELEASE_NOTES_0.1.4.md) for the complete stable-release summary.', '',
              'The release preserves the frozen 406-export scientific contract while freezing **557 tests**, **100% statement coverage**, **99.6604% raw branch coverage**, and an exact structural-debt contract with **0 unaudited branch debt**. The 0.1.4 Zenodo version DOI is intentionally left pending until Zenodo ingests the immutable release.',
          ]
          write('docs/release-0.1.4.md', '\n'.join(release_doc) + '\n')

          assert 'Development head | **0.1.4**' not in read('README.md')
          assert 'development head</span>' not in read('docs/index.md')
          assert 'VersionDOI =' not in read('pyproject.toml')
          assert 'doi: 10.5281/zenodo.22313884' not in read('CITATION.cff')
          print('release-facing metadata PASS')
          PY
      - name: Validate before commit
        run: |
          python scripts/audit_release_identity.py
          python -m compileall -q src tests scripts
      - name: Commit and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-0.1.4-release-docs.yml
          git add -A
          git commit -m "release: finalize gpbiometricspy 0.1.4 metadata [release-docs-applied]"
          git push origin HEAD:release-0.1.4-freeze
