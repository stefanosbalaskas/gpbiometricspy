name: apply-0.1.4-release-docs

on:
  push:
    branches: [release-0.1.4-freeze]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[release-docs-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: release-0.1.4-freeze
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Finalize ordinary release-facing files
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_required(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              write(path, text.replace(old, new))

          readme = read('README.md')
          old = '| Stable release | **0.1.3** |\n| Development head | **0.1.4** |\n| Release date | **2026-09-05** |'
          new = '| Stable release | **0.1.4** |\n| Release date | **2026-09-06** |'
          if old not in readme:
              raise SystemExit('README status block mismatch')
          readme = readme.replace(old, new)
          readme = readme.replace('In stable `0.1.3`, it is included in the Python distribution with installed launch commands.', 'In stable `0.1.4`, it is included in the Python distribution with installed launch commands.')
          old_archive = '`gpbiometricspy 0.1.3` is the current stable release. Its version-specific Zenodo DOI is **10.5281/zenodo.22313884**; the concept DOI identifies the evolving Python software record.\n\n- **Software concept DOI:** [10.5281/zenodo.22150872](https://doi.org/10.5281/zenodo.22150872)\n- **Previous version DOI (0.1.2):** [10.5281/zenodo.22150873](https://doi.org/10.5281/zenodo.22150873)\n'
          new_archive = '`gpbiometricspy 0.1.4` is the current stable release. Its version-specific Zenodo DOI will be recorded after Zenodo ingests the immutable `v0.1.4` GitHub release; the concept DOI identifies the evolving Python software record.\n\n- **Software concept DOI:** [10.5281/zenodo.22150872](https://doi.org/10.5281/zenodo.22150872)\n- **Previous version DOI (0.1.3):** [10.5281/zenodo.22313884](https://doi.org/10.5281/zenodo.22313884)\n- **Earlier version DOI (0.1.2):** [10.5281/zenodo.22150873](https://doi.org/10.5281/zenodo.22150873)\n'
          if old_archive not in readme:
              raise SystemExit('README archival block mismatch')
          write('README.md', readme.replace(old_archive, new_archive))

          index = read('docs/index.md')
          old_grid = '<div><span class="gp-status-value">0.1.3</span><span class="gp-status-label">stable release</span></div>\n<div><span class="gp-status-value">0.1.4</span><span class="gp-status-label">development head</span></div>'
          new_grid = '<div><span class="gp-status-value">0.1.4</span><span class="gp-status-label">stable release</span></div>\n<div><span class="gp-status-value">2026-09-06</span><span class="gp-status-label">release date</span></div>'
          if old_grid not in index:
              raise SystemExit('docs/index status grid mismatch')
          index = index.replace(old_grid, new_grid)
          start = index.index('!!! info "Stable 0.1.3 + validated 0.1.4 development line"')
          end = index.index('\n\n## Code or Studio', start)
          info = '\n'.join([
              '!!! info "Stable 0.1.4 release source"',
              '    This site is frozen from the validated `gpbiometricspy 0.1.4` release source (2026-09-06). The frozen scientific contract remains **406/406 exports with 0 pending**, with **557 tests**, **10,316/10,316 statements**, and **5,575/5,594 raw branches = 99.6604%**. The remaining **19** raw branch arcs are exact reviewed structural/caller-dominated entries; CI requires **0 unexpected**, **0 stale**, and **0 unaudited** branch debt. Raw coverage is not relabelled as 100%. The 0.1.4 version DOI will be added only after Zenodo ingests the immutable release; the software concept DOI remains [10.5281/zenodo.22150872](https://doi.org/10.5281/zenodo.22150872), and the previous 0.1.3 version DOI is [10.5281/zenodo.22313884](https://doi.org/10.5281/zenodo.22313884).',
          ])
          write('docs/index.md', index[:start] + info + index[end:])

          replace_required('docs/getting-started.md', '`0.1.3` is the stable public release; this documentation is frozen from the validated release source.', '`0.1.4` is the stable public release; this documentation is frozen from the validated release source.')
          replace_required('docs/plot-gallery.md', '<strong>Stable 0.1.3 documentation.</strong> This gallery is frozen from the validated <code>0.1.3</code> release source.', '<strong>Stable 0.1.4 documentation.</strong> This gallery is frozen from the validated <code>0.1.4</code> release source.')
          replace_required('docs/studio.md', 'The Studio application is included in the stable `0.1.3` distribution and requires the optional Shiny dependencies.', 'The Studio application is included in the stable `0.1.4` distribution and requires the optional Shiny dependencies.')

          replace_required('CHANGELOG.md', 'refreshes repository-facing validation status for the 0.1.4 development freeze without changing the current public stable release identity (`0.1.3`) before the separate stable-version promotion.', 'promotes the fully qualified branch-validation line to stable **0.1.4** release metadata while preserving raw **99.6604%** branch reporting and the exact structural-debt contract.')

          checklist = read('RELEASE_CHECKLIST.md')
          checklist = checklist.replace('- [ ] Promote package identity from `0.1.4` to stable `0.1.4` only after this hardening PR is merged and exact-main development gates are green.', '- [x] Promote the qualified 0.1.4 development identity to stable `0.1.4` only after the release-hardening tranche merged green.')
          checklist = checklist.replace('- [ ] Synchronize stable package, runtime `__version__`, Zenodo metadata, CFF citation metadata, generated documentation metadata, README/site, changelog, release notes and checklist without inventing a pre-ingestion 0.1.4 Zenodo version DOI.', '- [x] Synchronize stable package, runtime `__version__`, Zenodo metadata, CFF citation metadata, generated documentation metadata, README/site, changelog, release notes and checklist without inventing a pre-ingestion 0.1.4 Zenodo version DOI.')
          write('RELEASE_CHECKLIST.md', checklist)

          validation = read('VALIDATION.md')
          if '## 0.1.4 stable release freeze — 2026-09-06' not in validation:
              section = '\n'.join([
                  '', '', '## 0.1.4 stable release freeze — 2026-09-06', '',
                  'The 0.1.4 release source freezes the completed branch/path-validation campaign without changing the frozen 406-function scientific contract.', '',
                  '- package/runtime identity: **0.1.4**;',
                  '- frozen R semantic reference: **gpbiometrics 2.0.0**;',
                  '- API contract: **406 / 406 implemented; 0 pending**;',
                  '- scientific regression suite: **557 tests**;',
                  '- whole-package statements: **10,316 / 10,316 = 100.000%** with a **100% statement CI floor**;',
                  '- raw pure branches: **5,575 / 5,594 = 99.6604%** with a **99.6% raw branch CI floor**;',
                  '- audited structural/caller-dominated residual arcs: **19**;',
                  '- structural-debt contract: **0 unexpected, 0 stale, 0 unaudited branch debt**;',
                  '- audited branch accounting: **5,594 / 5,594 = 100.0000%**, explicitly not substituted for the honest raw coverage metric;',
                  '- stable tagging requires every exact-main release gate, including the branch/structural audit;',
                  '- no 0.1.4 Zenodo version DOI is recorded before Zenodo actually ingests the immutable GitHub release.',
              ])
              validation += section + '\n'
          write('VALIDATION.md', validation)

          assert 'Development head | **0.1.4**' not in read('README.md')
          assert 'development head</span>' not in read('docs/index.md')
          assert '\nVersionDOI = ' not in ('\n' + read('pyproject.toml'))
          assert 'doi: 10.5281/zenodo.22313884' not in read('CITATION.cff')
          print('ordinary release metadata PASS')
          PY
      - name: Validate stable identity
        run: |
          python scripts/audit_release_identity.py
          python -m compileall -q src tests scripts
      - name: Commit ordinary release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md VALIDATION.md RELEASE_CHECKLIST.md docs/index.md docs/getting-started.md docs/plot-gallery.md docs/studio.md
          git commit -m "release: finalize gpbiometricspy 0.1.4 docs [release-docs-applied]"
          git push origin HEAD:release-0.1.4-freeze
