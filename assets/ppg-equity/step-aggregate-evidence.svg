<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">BigIdeasLab STEP aggregate evidence summary</title>
  <desc id="desc">Aggregate-only summary of the authorized STEP execution: 53 participants, six wearable devices, Fitzpatrick categories 1 through 6, 361675 paired wearable-ECG measurements, and source-time activity counts for unlabelled, rest, breathe, activity and type strata.</desc>
  <rect width="960" height="620" rx="24" fill="#ffffff"/>
  <text x="48" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f172a">STEP external evidence — aggregate-only view</text>
  <text x="48" y="88" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Authorized BigIdeasLab_STEP v1.0 execution · no participant-level rows redistributed</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="118" width="190" height="92" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="68" y="151" font-size="28" font-weight="700" fill="#3730a3">53</text>
    <text x="68" y="180" font-size="14" fill="#475569">participants</text>

    <rect x="255" y="118" width="190" height="92" rx="14" fill="#ecfeff" stroke="#a5f3fc"/>
    <text x="275" y="151" font-size="28" font-weight="700" fill="#155e75">6</text>
    <text x="275" y="180" font-size="14" fill="#475569">wearable devices</text>

    <rect x="462" y="118" width="190" height="92" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="482" y="151" font-size="28" font-weight="700" fill="#166534">1–6</text>
    <text x="482" y="180" font-size="14" fill="#475569">Fitzpatrick categories</text>

    <rect x="669" y="118" width="243" height="92" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="689" y="151" font-size="28" font-weight="700" fill="#9a3412">361,675</text>
    <text x="689" y="180" font-size="14" fill="#475569">paired wearable–ECG rows</text>
  </g>

  <text x="48" y="260" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Source-time activity strata</text>
  <text x="48" y="285" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Counts are aggregate source-time rows from the authorized run; the unlabelled/NA stratum is preserved as unknown.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#334155">
    <text x="48" y="338">Unlabelled / NA</text>
    <rect x="190" y="320" width="520" height="24" rx="6" fill="#64748b"/>
    <text x="724" y="338" font-weight="700">86,609</text>

    <text x="48" y="388">Rest</text>
    <rect x="190" y="370" width="298" height="24" rx="6" fill="#6366f1"/>
    <text x="502" y="388" font-weight="700">49,669</text>

    <text x="48" y="438">Breathe</text>
    <rect x="190" y="420" width="72" height="24" rx="6" fill="#06b6d4"/>
    <text x="276" y="438" font-weight="700">12,008</text>

    <text x="48" y="488">Activity</text>
    <rect x="190" y="470" width="466" height="24" rx="6" fill="#22c55e"/>
    <text x="670" y="488" font-weight="700">77,585</text>

    <text x="48" y="538">Type</text>
    <rect x="190" y="520" width="76" height="24" rx="6" fill="#f97316"/>
    <text x="280" y="538" font-weight="700">12,724</text>
  </g>

  <line x1="48" y1="570" x2="912" y2="570" stroke="#e2e8f0"/>
  <text x="48" y="596" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b">Interpretation boundary: Fitzpatrick is subjective categorical phototype; row-level paired availability reflects reporting density/cadence and is not a generic device-failure or fairness metric.</text>
</svg>
