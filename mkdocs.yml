site_name: gpbiometricspy
site_description: Scientific Python workflows, Python-native methods and gpbiometricspy Studio for Gazepoint EDA/SCR, PPG/HRV, pupil, gaze, AOI and multimodal research.
site_url: https://stefanosbalaskas.github.io/gpbiometricspy/
site_author: Stefanos Balaskas
repo_url: https://github.com/stefanosbalaskas/gpbiometricspy
repo_name: stefanosbalaskas/gpbiometricspy
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Stefanos Balaskas · MIT License

theme:
  name: material
  language: en
  logo: assets/python-suite-logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow

plugins:
  - search
  - meta
  - privacy

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stefanosbalaskas/gpbiometricspy
      name: gpbiometricspy on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gpbiometricspy/
      name: gpbiometricspy on PyPI
    - icon: material/archive-outline
      link: https://doi.org/10.5281/zenodo.22150872
      name: gpbiometricspy on Zenodo
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0000-0003-2444-9796
      name: Stefanos Balaskas on ORCID

extra_css:
  - stylesheets/extra.css
  - stylesheets/product.css
  - stylesheets/api.css
  - stylesheets/experience.css

extra_javascript:
  - javascripts/api-filter.js

