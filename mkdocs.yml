site_name: gpbiometricspy
site_description: Scientific Python workflows for Gazepoint EDA/SCR, PPG/HRV, pupil, gaze, AOI and multimodal research.
site_url: https://stefanosbalaskas.github.io/gpbiometricspy/
site_author: Stefanos Balaskas
repo_url: https://github.com/stefanosbalaskas/gpbiometricspy
repo_name: stefanosbalaskas/gpbiometricspy
copyright: Copyright &copy; 2026 Stefanos Balaskas · MIT License

theme:
  name: material
  language: en
  logo: assets/python-suite-logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/stefanosbalaskas/gpbiometricspy
      name: gpbiometricspy on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/gpbiometricspy/
      name: gpbiometricspy on PyPI
    - icon: material/archive-outline
      link: https://doi.org/10.5281/zenodo.22150872
      name: gpbiometricspy on Zenodo

extra_css:
  - stylesheets/extra.css
  - stylesheets/api.css

extra_javascript:
  - javascripts/api-filter.js

nav:
  - Home: index.md
  - Start here:
      - Getting started: getting-started.md
      - Workflow map: workflows.md
      - Synthetic demo: demo.md
  - Workflows:
      - Workflow map: workflows.md
      - Examples:
          - Overview: examples/index.md
          - EDA / GSR / SCR: examples/eda-scr.md
          - PPG / HRV: examples/ppg-hrv.md
          - Pupil / gaze / AOI: examples/pupil-gaze.md
          - Multimodal alignment: examples/multimodal.md
          - Quality control + reporting: examples/quality-reporting.md
          - Interoperability: examples/interoperability.md
  - Plot gallery: plot-gallery.md
  - Articles:
      - Overview: articles/index.md
      - Start + overview:
          - Article roadmap: articles/article-roadmap.md
          - gpbiometrics workflow: articles/gpbiometrics-workflow.md
          - Synthetic data showcase: articles/synthetic-data-showcase.md
          - Original plot-gallery companion: articles/plot-gallery.md
      - EDA / SCR:
          - EDA, GSR and SCR workflow: articles/eda-scr-workflow.md
          - EDA and SCR visual diagnostics: articles/eda-scr-visual-diagnostics.md
          - Toolbox crosscheck visuals: articles/toolbox-crosscheck-visuals.md
      - PPG / HRV:
          - PPG, IBI, HRV and respiration: articles/ppg-hrv-workflow.md
          - PPG and HRV visual diagnostics: articles/ppg-hrv-visual-diagnostics.md
      - Pupil / gaze / AOI:
          - Pupil and gaze QC: articles/pupil-qc-workflow.md
          - Eye-tracking ecosystem bridges: articles/eye-tracking-ecosystem-bridges.md
          - Event alignment and AOI-linked biometrics: articles/event-alignment-aoi-workflow.md
      - Design + multimodal:
          - Multimodal event dashboard: articles/multimodal-event-dashboard.md
          - Cluster-permutation workflow: articles/cluster-permutation.md
          - Design audit workflow: articles/design-audit-workflow.md
          - Design release visual audit: articles/design-release-visual-audit.md
      - QC + reporting:
          - Quality-control workflow: articles/qc-workflow.md
          - Visual QC dashboard: articles/visual-qc-dashboard-workflow.md
          - Reporting and reproducibility: articles/reporting-reproducibility-workflow.md
          - Troubleshooting readiness: articles/troubleshooting-readiness.md
          - Private real-data smoke testing: articles/private-real-data-smoke-testing.md
      - Interoperability:
          - BIDS export workflow: articles/bids-export-workflow.md
          - MNE, EEG and LSL workflow: articles/mne-eeg-lsl-workflow.md
          - External toolbox bridges: articles/toolbox-bridges-workflow.md
          - Interoperability version testing: articles/interoperability-version-testing.md
          - gp3tools compatibility: articles/gp3tools-compatibility.md
  - API:
      - Browse by domain: api/index.md
      - EDA / GSR / SCR: api/eda-scr.md
      - PPG / HRV / respiration: api/ppg-hrv.md
      - Pupil / gaze / AOI: api/pupil-gaze-aoi.md
      - Events / alignment / multimodal: api/alignment-multimodal.md
      - QC / reporting / governance: api/qc-reporting.md
      - Statistics / design / simulation: api/statistics-design.md
      - Interoperability / exchange: api/interoperability.md
      - Core I/O / schema: api/core-io.md
      - Complete 406-function reference: api/reference.md
  - Validation & trust:
      - Parity & validation: parity.md
      - Deep validation: deep-validation.md
      - Private real-data validation: real-data-validation.md
      - Interpretation guardrails: interpretation.md
  - Integrations: integrations.md
  - Citation & archival: citation.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
