[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpbiometricspy"
version = "0.1.2.dev0"
description = "Python port of gpbiometrics 2.0.0 for Gazepoint biometric workflows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Stefanos Balaskas"}]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["gazepoint", "eye-tracking", "eda", "gsr", "hrv", "ppg", "physiology", "pupillometry"]

[project.optional-dependencies]
heartpy = ["heartpy>=1.2.7", "setuptools>=77,<82"]
biosppy = ["biosppy>=2.2.4", "peakutils>=1.3.4"]
pyhrv = ["pyhrv>=0.5.0", "peakutils>=1.3.4", "nolds<0.6.3", "setuptools>=77,<82"]
neurokit = ["neurokit2>=0.2.13"]
mne = ["mne>=1.12.1"]
lsl = ["pylsl>=1.18.2", "pyxdf>=1.17.5"]
bayes = ["pymc>=6.3"]
stats = ["statsmodels>=0.14"]
interop = [
  "heartpy>=1.2.7",
  "setuptools>=77,<82",
  "biosppy>=2.2.4",
  "peakutils>=1.3.4",
  "pyhrv>=0.5.0",
  "nolds<0.6.3",
  "neurokit2>=0.2.13",
  "mne>=1.12.1",
  "pylsl>=1.18.2",
  "pyxdf>=1.17.5",
  "statsmodels>=0.14",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
  "build>=1.2",
  "twine>=6",
]

[project.urls]
Homepage = "https://github.com/stefanosbalaskas/gpbiometricspy"
Repository = "https://github.com/stefanosbalaskas/gpbiometricspy"
Documentation = "https://stefanosbalaskas.github.io/gpbiometricspy/"
RReference = "https://stefanosbalaskas.github.io/gpbiometrics/"
Issues = "https://github.com/stefanosbalaskas/gpbiometricspy/issues"
PyPI = "https://pypi.org/project/gpbiometricspy/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpbiometricspy = ["data/**/*.csv", "data/**/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["gpbiometricspy"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["reference"]

[tool.ruff.lint]
# Keep CI focused on correctness defects. The parity port intentionally preserves
# compact scientific expressions, so broad E7 style enforcement is not a release gate.
select = ["E9", "F63", "F7", "F82"]
